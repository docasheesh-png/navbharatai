# Standalone proof (NOT production): does Amazon Bedrock's Mantle endpoint work with YOUR account?
#
# This runs scripts/bedrock-mantle-test.mjs on a GitHub runner using your Amazon Bedrock API key
# (read from the AWS_BEARER_TOKEN_BEDROCK repo SECRET — never committed, never printed). It prints
# the endpoint, HTTP status, request id, the full raw response body, and any error, so we can PROVE
# whether Mantle is the right integration path before migrating any NavBharatAI code.
#
# ONE-TIME SETUP:
#   Repo → Settings → Secrets and variables → Actions → New repository secret:
#     Name  = AWS_BEARER_TOKEN_BEDROCK
#     Value = your Bedrock API key (the "ABSK…" token — the SAME one set in Cloud Run)
#
# HOW TO RUN:
#   Repo → Actions → "Bedrock Mantle connectivity test" → Run workflow.
#   (Optionally override the region/model inputs.) Then read the run log.

name: Bedrock Mantle connectivity test

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'AWS region for the Mantle endpoint'
        default: 'us-east-1'
        required: true
      model:
        description: 'Model id to test'
        default: 'zai.glm-5'
        required: true

jobs:
  mantle-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight — require the Bedrock API key secret
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          if [ -z "$AWS_BEARER_TOKEN_BEDROCK" ]; then
            echo "::error::Secret AWS_BEARER_TOKEN_BEDROCK is not set. Add it in Settings → Secrets and variables → Actions (value = your ABSK… Bedrock API key)."
            exit 1
          fi
          echo "Bedrock API key secret is present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the Mantle proof test
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ inputs.region }}
          BEDROCK_GLM_MODEL: ${{ inputs.model }}
        run: node scripts/bedrock-mantle-test.mjs
