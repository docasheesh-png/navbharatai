# Build the SIGNED NavBharatAI iOS app (.ipa) for the Apple App Store / TestFlight — WITHOUT owning a Mac.
#
# WHY A WORKFLOW: an iOS build legally requires macOS + Xcode (Apple's hard rule). GitHub's macOS runners
# ARE real Macs in the cloud, so this workflow does the whole iOS build/sign/upload there — you never need
# to own a Mac. The one thing only you can provide is your Apple identity; we take it as an **App Store
# Connect API key** (a .p8 file you create on the web — no Mac, no Keychain, no certificate wrangling).
# With that one key, Xcode on the runner AUTOMATICALLY creates the distribution certificate + provisioning
# profile (`-allowProvisioningUpdates`), so there is nothing else to generate by hand.
#
# ONE-TIME SETUP (all on the web — no Mac needed):
#   A. App Store Connect → Users and Access → Integrations → App Store Connect API → generate an API key
#      with the "Admin" role (App Manager CANNOT create the distribution certificate for App Store cloud signing). Download the `AuthKey_XXXXXX.p8` (you can download it ONCE — keep it safe).
#      Note the Key ID (e.g. ABC123DEF4) and the Issuer ID (a UUID shown at the top of the Keys page).
#   B. Apple Developer → Membership → copy your Team ID (10 chars, e.g. 9ABCD1EFGH).
#   C. App Store Connect → My Apps → + → New App → Bundle ID `com.navbharat.ai`, name "NavBharatAI"
#      (create the app record ONCE so uploads have somewhere to land).
#   D. Repo → Settings → Secrets and variables → Actions → add 4 secrets:
#        IOS_ASC_KEY_ID        = the Key ID (e.g. ABC123DEF4)
#        IOS_ASC_ISSUER_ID     = the Issuer ID (the UUID)
#        IOS_ASC_KEY_BASE64    = EITHER the raw AuthKey_XXXXXX.p8 file contents pasted directly (open it in
#                                a text editor and paste ALL of it, the -----BEGIN/END PRIVATE KEY----- lines
#                                included — easiest, no encoding step) OR its base64 (`base64 -i AuthKey.p8`).
#        IOS_TEAM_ID           = your Team ID from step B
#
# HOW TO RUN:
#   Repo → Actions → "Build iOS App (.ipa, signed)" → Run workflow (main).
#   - Leave "upload" unchecked to just BUILD + download the .ipa artifact (a dry run to confirm signing works).
#   - Check "upload" to send the build straight to TestFlight/App Store Connect after building.
#
# HONEST NOTE: iOS code-signing on CI is fussier than Android. If the first run fails on a signing step,
# it fails LOUDLY (never a fake success) — read the error, and it's almost always a wrong Team ID, an API
# key without the "Admin" role (needed to create the distribution certificate), or the app record (step C) not created yet.

name: Build iOS App (.ipa, signed)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the build to App Store Connect / TestFlight after building'
        type: boolean
        default: false

jobs:
  build-ios:
    # macos-15 = a real Mac in the cloud with Xcode 16.x (this replaces owning a Mac). Must be 16+ because
    # the @capacitor-firebase/authentication plugin pulls firebase-ios-sdk 12.7+, whose Swift Package
    # requires the Xcode 16 toolchain (Swift 6.1) — the older default Xcode 15.4 fails SPM resolution with
    # "incompatible tools version (6.1.0)".
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pin the NEWEST installed Xcode 16.x (macos-15 ships several) so SPM can resolve the Firebase SDK.
      # Fails loudly if no Xcode 16 is present rather than silently building on an incompatible toolchain.
      - name: Select the latest Xcode 16 (Firebase SDK requires it)
        run: |
          LATEST="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LATEST" ]; then
            echo "::error::No Xcode 16.x found on the runner — the Firebase iOS SDK needs it. Installed Xcodes:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version | head -1

      # Fail EARLY and honestly if the Apple secrets are not set — a store .ipa MUST be signed with your
      # Apple identity, so we never hand back an unsigned/unusable build.
      - name: Pre-flight — require Apple signing secrets
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_ASC_KEY_BASE64: ${{ secrets.IOS_ASC_KEY_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=""
          [ -z "$IOS_ASC_KEY_ID" ] && missing="$missing IOS_ASC_KEY_ID"
          [ -z "$IOS_ASC_ISSUER_ID" ] && missing="$missing IOS_ASC_ISSUER_ID"
          [ -z "$IOS_ASC_KEY_BASE64" ] && missing="$missing IOS_ASC_KEY_BASE64"
          [ -z "$IOS_TEAM_ID" ] && missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing Apple signing secret(s):$missing — add them in Settings → Secrets and variables → Actions (see the header of this workflow file for the one-time web setup)."
            exit 1
          fi
          echo "All Apple signing secrets present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        run: npm run build

      # The ios/ native project is NOT committed (it is generated per-machine). Generate it fresh here.
      # `cap add ios` is a no-op if it already exists, so this is safe either way.
      - name: Generate & sync the Capacitor iOS project
        run: |
          npx cap add ios || echo "ios/ already present — continuing"
          npx cap sync ios

      # App Store REQUIRES a purpose string for every device permission the app can request, or review
      # REJECTS the binary (and iOS crashes on the first getUserMedia call without it). The app uses the
      # MICROPHONE (Sonic voice) + CAMERA + photo library (image attach) — same permissions as the
      # committed Android manifest (RECORD_AUDIO + CAMERA). Because ios/ is generated fresh above, its
      # default Info.plist has none of these, so we inject them here (idempotent Add-or-Set) into the
      # generated project. PlistBuddy ships on every macOS runner.
      - name: Inject iOS permission usage descriptions (App Store requires them)
        run: |
          PLIST="ios/App/App/Info.plist"
          set_key() {
            /usr/libexec/PlistBuddy -c "Add :$1 string \"$2\"" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 \"$2\"" "$PLIST"
          }
          set_key NSMicrophoneUsageDescription "NavBharatAI uses the microphone for voice conversations with the AI assistant."
          set_key NSCameraUsageDescription "NavBharatAI uses the camera to capture and scan images inside the app."
          set_key NSPhotoLibraryUsageDescription "NavBharatAI uses your photo library to attach images to your builds."
          set_key NSPhotoLibraryAddUsageDescription "NavBharatAI can save generated images to your photo library."
          echo "Usage descriptions now in Info.plist:"
          for k in NSMicrophoneUsageDescription NSCameraUsageDescription NSPhotoLibraryUsageDescription; do
            printf '  %s = %s\n' "$k" "$(/usr/libexec/PlistBuddy -c "Print :$k" "$PLIST")"
          done

      # Write the App Store Connect API key (.p8) where xcodebuild AND altool both look for it.
      #
      # ROBUST NORMALIZATION (2026-07-15): builds #7/#8 failed with Apple's "Authentication credentials are
      # missing or invalid" at the very first API call. That error means the signed JWT did not verify — the
      # two overwhelming causes are (a) the pasted .p8 lost its line breaks so the key body is corrupt (the old
      # BEGIN-header check still passed, masking it), or (b) the Key ID / Issuer ID are swapped or typo'd. This
      # step now (1) rebuilds a CANONICAL PEM from whatever was pasted — single-line, space-mangled, or base64 —
      # so paste corruption can't survive, (2) parses it with openssl to prove it is a real private key, and
      # (3) validates the Key ID + Issuer ID shape, failing with a precise message naming the wrong one.
      - name: Install & validate App Store Connect API key
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_ASC_KEY_BASE64: ${{ secrets.IOS_ASC_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          DEST="$HOME/.appstoreconnect/private_keys/AuthKey_${IOS_ASC_KEY_ID}.p8"

          # 1) Get the raw PEM text — accept a directly-pasted .p8 (contains BEGIN) OR base64 of the .p8 file.
          RAW="$IOS_ASC_KEY_BASE64"
          if ! printf '%s' "$RAW" | grep -q 'BEGIN PRIVATE KEY'; then
            RAW="$(printf '%s' "$RAW" | tr -d '[:space:]' | base64 -d 2>/dev/null || true)"
          fi
          if ! printf '%s' "$RAW" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::IOS_ASC_KEY_BASE64 is neither a valid .p8 (no -----BEGIN PRIVATE KEY----- header) nor base64 of one. Paste the ENTIRE AuthKey_*.p8 file contents (BEGIN/END lines included), or its base64."
            exit 1
          fi

          # 2) Rebuild a CANONICAL PEM: strip header/footer + ALL whitespace to recover the pure base64 body,
          #    then re-wrap at 64 cols. This makes a single-line or space-mangled paste produce a valid key.
          BODY="$(printf '%s' "$RAW" \
            | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' \
            | tr -d '[:space:]')"
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo ""
            echo "-----END PRIVATE KEY-----"
          } > "$DEST"

          # 3) Prove it is a real private key (openssl prints nothing on success — no secret leaks to the log).
          if ! openssl pkey -in "$DEST" -noout 2>/dev/null; then
            echo "::error::The App Store Connect key in IOS_ASC_KEY_BASE64 is not a valid private key even after normalization. It is likely truncated or the wrong file was pasted. Re-copy the ENTIRE contents of your AuthKey_XXXX.p8 (every character between and including the BEGIN/END lines) into the secret."
            exit 1
          fi

          # 4) Validate the two IDs (masked in logs — we only echo PASS/FAIL, never the value). The #1 human
          #    error is putting the 10-char Key ID into the Issuer ID field: the Issuer ID is a UUID.
          if ! printf '%s' "$IOS_ASC_ISSUER_ID" | grep -qiE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::IOS_ASC_ISSUER_ID is not a UUID. It must be the *Issuer ID* shown at the TOP of App Store Connect → Users and Access → Integrations → App Store Connect API (a long id with dashes like 69a6de70-1234-...), NOT the short Key ID."
            exit 1
          fi
          if ! printf '%s' "$IOS_ASC_KEY_ID" | grep -qE '^[A-Za-z0-9]{8,12}$'; then
            echo "::error::IOS_ASC_KEY_ID does not look like a Key ID (it should be ~10 letters/digits, e.g. ABC123DEF4 — the 'KEY ID' column next to the key you generated)."
            exit 1
          fi
          echo "API key normalized and parsed OK; Key ID + Issuer ID shape valid."

          # Also drop a copy in RUNNER_TEMP for the explicit -authenticationKeyPath below.
          cp "$DEST" "$RUNNER_TEMP/AuthKey_${IOS_ASC_KEY_ID}.p8"

      # Build + sign + upload via fastlane (fastlane/Fastfile). WHY fastlane instead of raw xcodebuild:
      # `xcodebuild -exportArchive` could not create the iOS Distribution certificate on a fresh runner
      # ("No signing certificate 'iOS Distribution' found"). fastlane's cert+sigh recipe explicitly
      # CREATES the distribution certificate + App Store profile with the API key (Admin role) and signs
      # manually — the proven CI path. NOTE: Capacitor 7+ uses SPM (not CocoaPods), so `cap add ios`
      # generates App.xcodeproj (no .xcworkspace); the Fastfile builds the .xcodeproj.
      - name: Build, sign & upload to TestFlight (fastlane)
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          DO_UPLOAD: ${{ inputs.upload }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${IOS_ASC_KEY_ID}.p8"
          fastlane ios beta

      - name: Upload the .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: navbharatai-release-ipa
          path: ${{ runner.temp }}/NavBharatAI.ipa
          retention-days: 14

      # The API key is a secret — never let it linger on the runner beyond this job.
      - name: Always remove the API key (never leaves the runner)
        if: always()
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${IOS_ASC_KEY_ID}.p8" || true
          rm -f "$RUNNER_TEMP/AuthKey_${IOS_ASC_KEY_ID}.p8" || true

      - name: Summary
        run: |
          echo "## NavBharatAI signed .ipa built ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.upload }}" = "true" ]; then
            echo "Uploaded to **App Store Connect** — it will appear under TestFlight in a few minutes (Apple processes the build)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Download the **navbharatai-release-ipa** artifact above. To publish, re-run with **upload** checked (sends it to TestFlight/App Store Connect)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle id \`com.navbharat.ai\` · hosted mode loads https://navbharatai.com — auth and all features work unchanged." >> "$GITHUB_STEP_SUMMARY"
