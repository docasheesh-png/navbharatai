apply plugin: 'com.android.application'

android {
    namespace = "com.navbharatai.app"
    compileSdk = rootProject.ext.compileSdkVersion
    // REQUIRED for the buildConfigField below. AGP has generated BuildConfig only on request since
    // 8.0, and this project is on 8.13 — without this line `buildConfigField` is accepted by Gradle
    // and the class it writes into is never generated, so the failure is a Java compile error about
    // a missing symbol rather than anything naming the real cause.
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        // Play Store package name (PERMANENT once published) — admin-registered the Play Console app
        // as com.navbharat.ai (2026-07-09), so the .aab's applicationId must match it. The `namespace`
        // above stays com.navbharatai.app (the internal code package) — applicationId ≠ namespace is a
        // standard, valid Android setup, so no Java source files move.
        applicationId "com.navbharat.ai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play Store requires a HIGHER versionCode on every upload — the CI passes ANDROID_VERSION_CODE
        // (e.g. the run number) so re-uploads bump automatically; local builds default to 1.
        versionCode System.getenv("ANDROID_VERSION_CODE") ? System.getenv("ANDROID_VERSION_CODE").toInteger() : 1
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ── META (Facebook / Instagram) APP EVENTS ────────────────────────────────────────────
        // WHY THIS EXISTS: Meta can only optimise an ad campaign for an outcome it can observe, and
        // for an Android INSTALL the only things that can report that outcome are this SDK or a paid
        // attribution partner (AppsFlyer / Adjust). Without one, a campaign can be optimised for link
        // CLICKS and nothing else, so budget goes to people who tap rather than people who install.
        //
        // Credentials come from the CI environment, which reads them from GitHub repo SECRETS — they
        // are never committed. Same discipline as the signing config below.
        //
        // 🔒 ABSENT (today's state) ⇒ THE APP IS BYTE-FOR-BYTE UNCHANGED IN BEHAVIOUR. The dependency
        // is not added at all (see `dependencies` below), so no Facebook code ships, nothing is
        // collected, no advertising-ID permission is merged in, and the Play Data Safety declaration
        // does not change. The meta-data entries in AndroidManifest.xml are then inert strings that
        // nothing reads. This is the same purely-additive pattern the release signingConfig uses.
        //
        // ⚠️ WHEN YOU DO SET THEM: the SDK collects the advertising ID and app events, which MUST be
        // declared in Play Console → App content → Data safety before that build is rolled out.
        // Shipping the collection without the declaration is a policy violation, not a detail.
        // ── PLAY INTEGRITY — the device check behind the referral welcome gift ────────────────
        // The referral plan pays real credit to a new user and to whoever brought them, and every
        // rupee of it rests on one idea: a physical Android handset is scarce, a free email address
        // is not. Play Integrity is the only thing that can tell a genuine Play-installed app on a
        // genuine device from an emulator farm or a patched APK, because it is attested by hardware
        // we do not own and signed by a key we do not hold.
        //
        // Google requires the CLOUD PROJECT NUMBER that owns the Play Integrity API. It is a build
        // input rather than something typed into Java because it differs per environment and a wrong
        // one fails at the REQUEST — so it belongs beside the Meta credentials above, not in source.
        //
        // 🔒 ABSENT ⇒ THE APP IS UNCHANGED. The plugin reports "not-configured", requests no token,
        // and the server refuses to pay — which is the same outcome as any other failure here. There
        // is no path where a missing number quietly becomes a verified device.
        //
        // ⚠️ IT IS A NUMBER, NOT THE PROJECT ID. `gen-lang-client-0866594388` is the id; the number
        // is the digits beside it on the Google Cloud console home. A non-numeric value parses to 0
        // and reads as not-configured, which is the safe direction and is why the parse is lenient.
        def playIntegrityProject = (System.getenv("PLAY_INTEGRITY_CLOUD_PROJECT") ?: "").trim()
        buildConfigField "String", "PLAY_INTEGRITY_CLOUD_PROJECT",
                "\"" + (playIntegrityProject ==~ /\d+/ ? playIntegrityProject : "0") + "\""

        def fbAppId = (System.getenv("FACEBOOK_APP_ID") ?: "").trim()
        def fbClientToken = (System.getenv("FACEBOOK_CLIENT_TOKEN") ?: "").trim()
        // BOTH are required: an app id with no client token cannot initialise, and half-configured is
        // exactly the "built but not really working" state that is not allowed to exist. The
        // dependency block below re-tests the same pair — an id without a token adds no SDK.
        resValue "string", "facebook_app_id", fbAppId
        resValue "string", "facebook_client_token", fbClientToken
        // NOTE: there is deliberately NO manifest placeholder switching the SDK's three collection
        // flags. They are hard-wired OFF in AndroidManifest.xml and opened at runtime only after the
        // user grants consent (MetaConsentPlugin.java) — a build-time "true" would start collecting
        // before the banner was even drawn.
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // RELEASE SIGNING (Play Store .aab) — the keystore + passwords come ONLY from the CI env, which
    // reads them from GitHub repo secrets (never committed, never in source). When they are absent
    // (local build / the debug workflow) the release build is simply left UNSIGNED — no crash — so
    // this is purely additive. See .github/workflows/android-aab.yml + MOBILE_PUBLISHING.md.
    signingConfigs {
        release {
            def ksFile = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign ONLY when a keystore is supplied (the CI release build); otherwise unsigned.
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // GOOGLE PLAY BILLING — the in-app token top-up rail (PlayBillingPlugin.java).
    //
    // UNCONDITIONAL, unlike the Meta SDK below: Play Billing needs no credential, so there is no
    // half-configured state to guard against, and a direct dependency keeps the plugin readable
    // instead of reflective. The FEATURE is gated at runtime by the server's STORE_BILLING flag —
    // with it off, this library ships but nothing in the app ever opens a purchase sheet.
    //
    // v8 is Google's hard floor for any new app/update from 31 Aug 2026 ("By Aug 31, 2026, all new
    // apps and updates to existing apps must use Billing Library version 8 or later" — Play Console
    // refused this release on 7.1.1 with exactly that message). 9.1.0 is the latest stable as of this
    // writing, so it is used directly rather than pinning the bare floor and needing this bump again
    // on the next upload. PlayBillingPlugin is written against v8's ProductDetailsResponseListener
    // shape (QueryProductDetailsResult, not a bare List<ProductDetails> — a real, checked breaking
    // change from v7), so a downgrade below 8.0.0 would not compile, which is the failure mode wanted.
    implementation 'com.android.billingclient:billing:9.1.0'

    // Play Integrity — the device check behind the referral welcome gift. UNCONDITIONAL, unlike the
    // Meta SDK below: the plugin imports it directly, so a build without it would not COMPILE, and a
    // reflection dance to make it optional would buy nothing. It collects nothing by itself — it is
    // an API the app calls, and only when a referral step is actually being claimed.
    implementation 'com.google.android.play:integrity:1.4.0'

    // Meta app events — added ONLY when both credentials are configured (see defaultConfig above).
    // `facebook-core` is the minimal artifact: install + app-event reporting, WITHOUT Facebook Login,
    // sharing or the rest of the SDK surface. We need measurement, not a login provider, and every
    // extra artifact is extra size, extra permissions and extra Data Safety surface for nothing.
    if (!(System.getenv("FACEBOOK_APP_ID") ?: "").trim().isEmpty()
            && !(System.getenv("FACEBOOK_CLIENT_TOKEN") ?: "").trim().isEmpty()) {
        implementation 'com.facebook.android:facebook-core:17.0.2'
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
