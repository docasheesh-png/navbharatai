<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme (admin 2026-07-14): set data-theme on <html> BEFORE first paint so the app renders in the
         saved theme with no dark→theme flash (FOUC). React keeps it in sync afterwards (App.tsx). -->
    <script>
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) {}
    </script>
    <!-- viewport replaced below with viewport-fit=cover for PWA -->
    <title>NavBharatAI v5.0 — AI App Maker</title>
    
    <!-- Branding Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NavBharatAI" />

    <!-- Safe-area / notch support, and NO PINCH-ZOOM (admin 2026-08-24: "do unglio se jaise webpage
         zoom karte hai woh zoom app me nahi hona chahiye").

         `user-scalable=no, maximum-scale=1` is the ANDROID half of the answer and is honoured there.
         iOS has ignored it since Safari 10, on purpose — so on iPhone this line does nothing on its
         own and the real blocker is the `gesturestart` handler in src/lib/zoomLock.ts. The CSS
         `touch-action: pan-x pan-y` in index.css is the third layer (Chrome's standards-based one).
         All three are needed; each platform answers to a different mechanism. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    
    <!-- Open Graph (Metadata for WhatsApp, Telegram, Discord link sharing) -->
    <meta property="og:title" content="NavBharatAI v5.0" />
    <meta property="og:description" content="नए भारत का अपना AI - Sovereign Intelligent Enterprise Architect Console" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://navbharatai.com" />
    
    <!-- Twitter Card (Twitter/X preview metadata) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NavBharatAI v5.0" />
    <meta name="twitter:description" content="नए भारत का अपना AI - Sovereign Intelligent Enterprise Architect Console" />
    <meta name="twitter:image" content="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
