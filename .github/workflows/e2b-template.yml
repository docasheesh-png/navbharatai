# Build & publish the NavBharatAI Pro v3.0 custom E2B builder template.
#
# WHY A WORKFLOW: building an E2B template needs the E2B API key (and, for the
# legacy path, Docker). GitHub's runners have what's needed; the Claude web
# sandbox does not (api.e2b.dev is egress-blocked there, no key is mounted). So
# the one-time template build runs here.
#
# BUILD SYSTEM v2: E2B deprecated the v1 `e2b template build` CLI path (it now
# exits non-zero). This workflow uses the v2 SDK build — infra/e2b/build.mjs
# defines the template from e2b.Dockerfile and calls Template.build(). The image
# build itself runs on E2B's cloud build infra.
#
# HOW TO RUN:
#   1. Repo → Settings → Secrets and variables → Actions → New repository secret
#        Name:  E2B_API_KEY     Value: <your e2b.dev API key>
#   2. Repo → Actions → "Build E2B Builder Template" → Run workflow.
#   3. When it finishes, the job summary shows the usable template ALIAS.
#   4. Set Cloud Run env  E2B_TEMPLATE_ID=<alias>  (the follow-up code-wiring PR
#      makes the server use it). Until then nothing changes in prod.
#
# Manual-only (workflow_dispatch) so it never rebuilds — and never incurs E2B
# build cost — on ordinary pushes.

name: Build E2B Builder Template

on:
  workflow_dispatch:
    inputs:
      template_kind:
        description: 'Which template to build'
        required: true
        type: choice
        options:
          - default
          - android
          - fullstack
        default: 'default'
      template_name:
        description: 'E2B template name (alias used by Sandbox.create) — leave blank to use the kind''s default alias'
        required: false
        default: ''

jobs:
  build-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify E2B_API_KEY secret is configured
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo "::error::E2B_API_KEY repo secret is not set. Add it under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "E2B_API_KEY is present (length ${#E2B_API_KEY})."

      - name: Resolve build parameters for the chosen template kind
        id: params
        run: |
          if [ "${{ github.event.inputs.template_kind }}" = "android" ]; then
            DOCKERFILE=e2b-android.Dockerfile
            DEFAULT_NAME=navbharat-android-builder
            CPU_COUNT=4
            MEMORY_MB=8192
          elif [ "${{ github.event.inputs.template_kind }}" = "fullstack" ]; then
            # Polyglot / multi-service template (AB-1 / AB-2): Node + Python + JDK17/Maven + Go +
            # MongoDB + Redis. Sized like the Android template (4 vCPU / 8 GB) because a JVM/Go build
            # plus a local Mongo/Redis needs materially more headroom than a plain React build.
            DOCKERFILE=e2b-fullstack.Dockerfile
            DEFAULT_NAME=navbharat-fullstack-builder
            CPU_COUNT=4
            MEMORY_MB=8192
          else
            DOCKERFILE=e2b.Dockerfile
            DEFAULT_NAME=navbharat-builder
            CPU_COUNT=2
            # 4 GB (was 2 GB): a real build report showed the Vite dev server getting OOM-killed at 2 GB
            # (server repeatedly died mid-build → blank preview despite a clean build). 4 GB gives the
            # dev server + npm + the app headroom. Rebuild the template for this to take effect.
            MEMORY_MB=4096
          fi
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "default_name=$DEFAULT_NAME" >> "$GITHUB_OUTPUT"
          echo "cpu_count=$CPU_COUNT" >> "$GITHUB_OUTPUT"
          echo "memory_mb=$MEMORY_MB" >> "$GITHUB_OUTPUT"
          NAME="${{ github.event.inputs.template_name }}"
          echo "name=${NAME:-$DEFAULT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build & publish template (E2B build system v2)
        working-directory: infra/e2b
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          TEMPLATE_NAME: ${{ steps.params.outputs.name }}
          DOCKERFILE: ${{ steps.params.outputs.dockerfile }}
          CPU_COUNT: ${{ steps.params.outputs.cpu_count }}
          MEMORY_MB: ${{ steps.params.outputs.memory_mb }}
        run: |
          npm install
          node build.mjs

      - name: Surface the template alias
        if: success()
        run: |
          NAME="${{ steps.params.outputs.name }}"
          KIND="${{ github.event.inputs.template_kind }}"
          echo "## E2B template build complete ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Kind:** \`$KIND\`  ·  **Template alias:** \`$NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$KIND" = "android" ]; then
            echo "The alias is usable directly as the template id. Next:" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Set Cloud Run env \`ANDROID_E2B_TEMPLATE_ID=$NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "2. Run the Bubblewrap/APK-build code-wiring PR (not built yet — see infra/e2b/README.md)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$KIND" = "fullstack" ]; then
            echo "The alias is usable directly as the template id. Next:" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Set Cloud Run env \`FULLSTACK_E2B_TEMPLATE_ID=$NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "2. Run the polyglot/multi-service code-wiring PR (per-build routing to this template + runtime/DB detection — see infra/e2b/README.md)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The alias is usable directly as the template id. Next:" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Set Cloud Run env \`E2B_TEMPLATE_ID=$NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "2. Run the code-wiring PR (Sandbox.create template + MODE A enable + MODE A→B fallback)." >> "$GITHUB_STEP_SUMMARY"
          fi
