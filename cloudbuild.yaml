# Google Cloud Build Pipeline Configuration (cloudbuild.yaml)
# Orchestrated by navBharat AI for enterprise-scale Docker integration.

steps:
  # P-BRE.5 — Remote build cache. Warm the BuildKit layer cache from the previous `:latest` image in
  # the registry (the registry IS the remote cache — no extra GCS bucket needed). Non-fatal: on the
  # very first build (no `:latest` yet) or a registry hiccup this exits 0 so the deploy never breaks.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull gcr.io/$PROJECT_ID/navbharat-cloud-run:latest || exit 0'

  # Step 1: Build the optimized container image, reusing cached layers (esp. the `npm ci` layer when
  # package*.json is unchanged → cold build drops from ~5 min toward ~2 min). BUILDKIT_INLINE_CACHE
  # bakes cache metadata into the pushed image so the NEXT build can `--cache-from` it.
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      # SECURITY Phase 4 — cross-origin preview origin. Default EMPTY (see substitutions below) = the
      # exact same-origin preview behaviour today (zero change). Set the _VITE_PREVIEW_ORIGIN trigger
      # substitution to https://mitrify.xyz once the preview subdomain is live (preview-host/README.md).
      - '--build-arg'
      - 'VITE_PREVIEW_ORIGIN=${_VITE_PREVIEW_ORIGIN}'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'
      - '.'

  # Step 2: Push the container image directly to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'

  # Step 3: Push the stable latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'

  # Step 4: Deploy the immutable image revision to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'navbharat-ai-prod'
      - '--image'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--update-env-vars'
      # PLATFORM_MAX_INSTANCES is the SAME `_MAX_INSTANCES` number the deploy flag below uses, handed to
      # the running server so the admin load board reports the real ceiling instead of a code default
      # that can drift away from it. One number, two consumers — the drift is unrepresentable.
      # (`--update-env-vars` adds/updates only these keys; every other Cloud Run env survives untouched.)
      - 'NODE_ENV=production,PLATFORM_MAX_INSTANCES=${_MAX_INSTANCES}'
      - '--allow-unauthenticated'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--timeout'
      - '3600'
      - '--concurrency'
      - '100'
      - '--cpu-boost'
      - '--execution-environment'
      - 'gen2'
      - '--quiet'
  # P2.4 — Disaster Recovery. The app exposes liveness (/api/live) and readiness
  # (/api/ready) probes. Wire them into the Cloud Run service with the documented
  # one-time command in docs/DR_RUNBOOK.md §3 (gcloud run services update --startup-probe
  # / --liveness-probe). They are applied manually (operator watches the deploy succeed)
  # rather than on this unattended deploy step — a wrong probe flag here would fail the
  # auto-deploy. Once applied, the probe config persists across image-only deploys.
  # Scheduled Firestore backups + restore are documented in docs/DR_RUNBOOK.md §1–§2.
  # P3.3 — Scalability/HA. min-instances stays 0 (budget). Cold starts are mitigated by
  # GET /api/warm + an external Cloud Scheduler ping (no self-ping); see docs/SCALABILITY.md
  # §1. Multi-region readiness (config-only, no spend yet) is assessed in docs/SCALABILITY.md §2.

  # ⛔ THERE IS NO STEP 5 ANY MORE — THE REGISTRY PRUNE RAN ON THE DEPLOY PATH AND RACED IT
  # (removed 2026-09-18, after `gcloud run deploy` failed with
  #  `Image 'gcr.io/$PROJECT_ID/navbharat-cloud-run:1431bafe…' not found.`).
  #
  # What used to stand here: a bounded `gcloud container images delete … --force-delete-tags` sweep,
  # keeping the newest _KEEP_IMAGES digests, skipping anything younger than _PRUNE_MIN_AGE and anything
  # a Cloud Run revision still referenced. It was the ONLY thing in this project that deletes a
  # platform image.
  #
  # WHY IT HAD TO LEAVE THE BUILD PATH, and it is not the sweep's arithmetic that was wrong — it is
  # that it ran BESIDE other builds:
  #
  #   * Four PRs merged inside three minutes, so four Cloud Builds ran CONCURRENTLY. Build B's Step 5
  #     therefore executes while build A sits between its `docker push` (Step 2) and its
  #     `gcloud run deploy` (Step 4) — a window in which A's image EXISTS in the registry and is
  #     referenced by NO revision yet.
  #   * Both guards are blind in exactly that window, together. The in-use guard reads
  #     `gcloud run revisions list`, and an image that has not been deployed yet is in no revision.
  #     The age floor reads `--sort-by=TIMESTAMP`, which is the image's CREATED time out of its
  #     config — and this pipeline builds with `--cache-from`, so BuildKit cache reuse can hand a
  #     freshly pushed image an OLDER creation time. Step 5's own comment said so in those words:
  #     *"age alone could still mis-rank a new image. That is precisely why guard (1) exists"* — and
  #     guard (1) is the one that cannot see an undeployed image.
  #   * `--force-delete-tags` then removes the `:$COMMIT_SHA` tag as well as the digest, which is
  #     precisely the shape of the failure: the deploy asked for a tag that had been deleted out from
  #     under it seconds earlier.
  #
  # ⚠️ HONEST LIMIT OF THAT DIAGNOSIS: no session here can read the GCR audit log, so this is a
  # mechanism consistent with every observed fact, not a proven one. Removing the step is safe
  # whichever way it turns out — a step that only ever DELETES can only ever stop deletions — but a
  # deploy that fails the same way again means the cause is elsewhere and this note is wrong.
  #
  # 🔴 STORAGE NOW GROWS UNBOUNDED UNTIL SOMEBODY CONFIGURES THE REPLACEMENT. Registry storage was
  # ~32% of the monthly bill, which is why this sweep existed at all. The replacement is a native
  # **Artifact Registry cleanup policy** on the `gcr.io` repository — it runs server-side, on
  # Google's clock, entirely OFF this build path, so it cannot race a deploy by construction.
  # Console → Artifact Registry → the repo → Cleanup policies. Use a KEEP policy
  # (`Keep most recent versions`, generously many) together with a conditional delete that also
  # carries an `older than` age — never a bare age rule on its own.
  #
  # ⚠️ AND THE ONE THING A NATIVE POLICY CANNOT DO, stated rather than discovered later: it cannot
  # see Cloud Run. This repo already found that, for the user-apps registry, and wrote it down
  # (PROGRESS.md 2026-09-13, `imageRetention.ts`): with `--min-instances 0` a cold start RE-PULLS the
  # live revision's image, so a policy that deletes it kills the site with nothing in the code to
  # explain why — and the case where that bites is the one that matters most, when a deploy has
  # FAILED and traffic is still being served by an OLDER revision while newer images push it out of
  # the keep window. That is survivable HERE, unlike there, only because one service deploys in
  # order: it needs a long run of consecutive failed deploys to happen at all. Size the keep count
  # for that, not for tidiness.
  #
  # The strictly better end state, if the admin ever wants it, is the server-side sweep this repo
  # already runs for user apps (`imageCleanupSweep.ts`, which DOES read Cloud Run before deleting)
  # pointed at the platform registry too. That is a build, not a console setting, and it is not in
  # this change.

substitutions:
  # SECURITY Phase 4 — the cross-origin preview origin, baked into the client bundle at build time.
  # EMPTY default = the exact same-origin preview behaviour today (zero change). Override in the Cloud
  # Build trigger (set _VITE_PREVIEW_ORIGIN = https://mitrify.xyz) once the preview subdomain is live.
  _VITE_PREVIEW_ORIGIN: ''
  # ⚠️ `_KEEP_IMAGES`, `_PRUNE_MIN_AGE` and `_PRUNE_MAX` were REMOVED with Step 5 (2026-09-18) —
  # nothing reads them any more, and Cloud Build's default `MUST_MATCH` fails a build on a
  # substitution that is declared and never used. If the Cloud Build TRIGGER carries an override for
  # any of those three names, delete that row in the trigger too, or the next build fails at config
  # parse with "key in the substitution data is not matched in the template".
  # SCALE (ROADMAP §12 #2) — the platform's own hard ceiling on concurrent capacity.
  #
  # RAISED 10 -> 100 (2026-09-08). With `--concurrency 100`, ten instances is a hard ceiling of ~1,000
  # concurrent in-flight requests; past it Cloud Run queues and then SHEDS. That is the honest answer to
  # "does the server just scale?" — the mechanism does, but only up to the number we told it, and ten
  # was that number. One hundred moves the ceiling to ~10,000 concurrent requests.
  #
  # It costs NOTHING while idle: `--min-instances` stays 0, and Cloud Run bills instances that actually
  # run. What it does buy is exposure — a traffic spike (or an abusive one) can now scale to 100 x 2 vCPU
  # before anything stops it, so this stays a BOUND rather than becoming unlimited, and it is a
  # substitution so the admin can lower it in the Cloud Build trigger without a code change or a deploy.
  #
  # ⚠️ Raising this multiplies anything that runs per-instance. That is why the scheduled-job lease
  # (§12 #1, `lib/jobLease.ts`) shipped FIRST, and why the next per-instance ceiling in that section —
  # the hot metrics document, §12 #4 — is the one to watch as this number is used.
  _MAX_INSTANCES: '100'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'
