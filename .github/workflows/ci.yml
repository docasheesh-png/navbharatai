name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Typecheck (frontend)
        run: npm run typecheck

      - name: Typecheck (server modules - strict guardrail)
        run: npm run typecheck:server

      - name: Test
        run: npm test

      - name: Build (frontend bundle + server bundle — catches build-only breaks)
        run: npm run build

      - name: Bundle size budget (P-TQA.5 — fail on bundle bloat)
        run: npm run test:bundle

      - name: Boot smoke-check (server starts without crash)
        run: npm run boot:check
