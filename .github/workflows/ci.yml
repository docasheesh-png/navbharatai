name: CI

# De-duplicated (2026-07-14): `push: ['**']` + `pull_request` ran CI TWICE on every PR branch
# (once for the branch push, once for the PR event). Now: `main` runs via push; every other branch
# runs via its pull_request (open/synchronize) — one CI run per change instead of two.
on:
  push:
    branches: [main]
  pull_request:
  # Manual escape hatch (added 2026-08-15): during a GitHub incident, event-triggered runs (push /
  # pull_request) silently stopped being created while workflow_dispatch kept working — leaving no
  # way to run the merge gate at all. Dispatching against a PR branch runs the SAME gate on the same
  # code; it just isn't attached to the PR's checks tab.
  workflow_dispatch:

jobs:
  queue-retry-drills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Download and verify the locked Firestore emulator
        run: |
          mkdir -p "$RUNNER_TEMP/phase2-safety"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const { firestore } = JSON.parse(readFileSync('node_modules/firebase-tools/lib/emulator/downloadableEmulatorInfo.json', 'utf8'));
          const destination = `${process.env.RUNNER_TEMP}/phase2-safety/firestore.jar`;
          const download = spawnSync('curl', ['--fail', '--silent', '--show-error', '--location', '--retry', '3', firestore.remoteUrl, '--output', destination], { stdio: 'inherit' });
          assert.equal(download.status, 0, 'Emulator download failed');
          const bytes = readFileSync(destination);
          assert.equal(bytes.length, firestore.expectedSize);
          assert.equal(createHash('sha256').update(bytes).digest('hex'), firestore.expectedChecksumSHA256);
          NODE
      - name: Real database and multiprocess queue/retry drills
        env:
          TZ: UTC
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18781
        run: |
          java -Xmx512m -jar "$RUNNER_TEMP/phase2-safety/firestore.jar" --host 127.0.0.1 --port 18781 --project_id demo-navbharatai-phase2 --single_project_mode true --single_project_mode_error true > "$RUNNER_TEMP/phase2-safety/firestore.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import net from 'node:net';
          const deadline = Date.now() + 30_000;
          for (;;) {
            const ready = await new Promise((resolve) => {
              const socket = net.connect(18781, '127.0.0.1');
              socket.once('connect', () => { socket.destroy(); resolve(true); });
              socket.once('error', () => resolve(false));
            });
            if (ready) break;
            if (Date.now() >= deadline) throw new Error('Local emulator did not start');
            await new Promise((resolve) => setTimeout(resolve, 100));
          }
          NODE
          node scripts/phase2-firestore-drills.mjs --emulator 127.0.0.1:18781 | tee "$RUNNER_TEMP/phase2-safety/firestore-drills.log"
          node --import ./node_modules/tsx/dist/loader.mjs scripts/failedReportAutopsy.check.mjs --emulator 127.0.0.1:18781 | tee "$RUNNER_TEMP/phase2-safety/autopsy-drills.log"
          node --import ./node_modules/tsx/dist/loader.mjs scripts/deepinfraComparison.check.mjs --emulator 127.0.0.1:18781 | tee "$RUNNER_TEMP/phase2-safety/deepinfra-comparison.log"
          node --import ./node_modules/tsx/dist/loader.mjs scripts/freeChainQuotaLane.check.mjs --emulator 127.0.0.1:18781 | tee "$RUNNER_TEMP/phase2-safety/free-chain-quota-lane.log"
          node --import ./node_modules/tsx/dist/loader.mjs scripts/mitrify-guest-emulator.mjs --emulator 127.0.0.1:18781 | tee "$RUNNER_TEMP/phase2-safety/mitrify-admission.log"
          node scripts/session-revocation-rules.check.mjs --emulator 127.0.0.1:18781 --project demo-navbharatai-phase2 | tee "$RUNNER_TEMP/phase2-safety/session-rules.log"
      - name: Upload build safety evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase2-queue-retry
          path: ${{ runner.temp }}/phase2-safety/*.log
          if-no-files-found: error

  build-and-test:
    runs-on: ubuntu-latest
    # The full 48k-test coverage run remains mandatory. Main recently needed 44m13s and another
    # main run plus PR run 41403264320 hit the former 45m job cap while tests were still advancing.
    # Allow 60m for the complete gate on shared hosted runners; per-test/hook timeouts and coverage
    # thresholds are unchanged. A cancelled/incomplete run never counts as passing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # 🔴 THE GATE RUNS THE RUNTIME IT GUARDS (Q-1060). This said '20' from the day the file was created
      # (#3538) while the Dockerfile, the store workflows and @capacitor/cli 8 all run 22 — so the suite
      # tested a runtime nobody ships, and any test needing the Capacitor CLI could not run here at all
      # ("The Capacitor CLI requires NodeJS >=22.0.0"). The version is `engines.node` in package.json now,
      # and tests/oneDeclaredRuntime.test.ts fails when any workflow drifts from it.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'

      # npm's legacy `/v1/security/audits/quick` endpoint (used by `npm audit`) is being retired and now
      # returns a 400 "Invalid package tree" error on EVERY request — confirmed 2026-07-26 against main's
      # own committed lockfile, not caused by any specific PR. The bundled npm on Node 20 runners (10.8.x)
      # still calls that legacy endpoint. Confirmed (2026-07-26, via `npx npm@11.18.0 audit --json`) that
      # npm 11.x DOES call the correct new `/v1/security/advisories/bulk` endpoint instead — npm 12.x would
      # too but requires Node 22+, which this job doesn't run (npm 11.18.0 supports Node ^20.17.0). Pinned
      # (not @latest) for reproducibility. Remove this step (or note if it turned out not to help) once
      # confirmed either way — see PROGRESS.md 2026-07-26 for the full investigation.
      - name: Upgrade npm (root-cause attempt for the audit-gate false-block, see PROGRESS.md 2026-07-26)
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Security audit gate (P-TQA.7 — BLOCKS new high/critical; allowlist for triaged advisories)
        run: npm run audit:gate

      - name: Supply-chain provenance (P-SEC.10 — npm package signatures; informational, never blocks)
        run: npm audit signatures
        continue-on-error: true

      - name: License compliance gate (P-SEC.6 — BLOCKS new strong-copyleft GPL/AGPL)
        run: npm run license:gate

      - name: Generate SBOM (P-SEC.6 — CycloneDX)
        run: npm run sbom

      - name: Upload SBOM artifact (P-SEC.6)
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn

      - name: Typecheck (frontend)
        run: npm run typecheck

      # An unused import is not a style nit — it keeps its whole module on the load path. App.tsx
      # imported five components it never rendered (AdminDashboard, AIChat, WorkspacePane,
      # DeployModal, MessageContent): ~50 KB gzipped shipped to every visitor for nothing, and
      # nothing flagged it because `noUnusedLocals` is off (it would also fail on ~122 unused LOCALS,
      # which are a separate, behaviour-touching cleanup). Retire this step for the compiler flag
      # once those are done — see the script header.
      - name: No unused imports (dead weight on the first-paint path)
        run: node scripts/noUnusedImports.mjs

      # THE STORE BUILDS CANNOT BREAK SILENTLY (2026-09-20). Both the .aab and the .ipa workflows
      # failed on a `main` this job had just passed: an illegal `--` inside an Android XML comment,
      # and two modules whose names differ only by case (fine on Linux, one file on the macOS runner).
      # Neither is visible to tsc, vitest or a Linux `npm run build`. Milliseconds, no SDK required.
      - name: Native shell guard (Android XML + case-ambiguous module names)
        run: npm run native:guard

      - name: Typecheck (server modules - strict guardrail)
        run: npm run typecheck:server

      - name: Typecheck (benchmark tools - strict guardrail)
        run: npm run typecheck:benchmark

      - name: Failed-report OAuth protocol and security checks
        run: node --experimental-strip-types scripts/failedReportOAuth.check.mjs

      - name: Mitrify offline transport and privacy checks
        run: npm run test:mitrify

      - name: Offline answer-quality evaluator self-check (no model calls)
        run: node scripts/chatAnswerQuality.check.mjs

      # ONE test run, not two (2026-08-06). This job ran `npm test` (`vitest run`) and then
      # `npm run test:coverage` (`vitest run --coverage`) — the SAME 12,400 tests twice, the second time
      # with coverage instrumentation, which is the slower of the two. The coverage run already produces
      # the pass/fail signal, so the first was pure duplication and by far the largest cost in this job.
      #
      # WHY IT MATTERED ENOUGH TO CHANGE: two consecutive runs were cancelled at exactly 15.0 and 15.1
      # minutes while a 13-minute run passed, so CI was sitting on a hard cap that comes from outside
      # this file (there is no timeout-minutes here and ubuntu-latest defaults to 360). Every PR had
      # become a coin flip. No gate is removed — the coverage gate still blocks on a real regression, and
      # a failing test still fails this step exactly as before.
      - name: Test + coverage gate (P-TQA.1 — runs the suite once; BLOCKS on a real coverage regression)
        run: npm run test:coverage

      - name: Build (frontend bundle + server bundle — catches build-only breaks)
        run: npm run build

      - name: Bundle size budget (P-TQA.5 — fail on bundle bloat)
        run: npm run test:bundle

      - name: Boot smoke-check (server starts without crash)
        run: npm run boot:check

      # 🔴 THE BOOT SMOKE-CHECK ABOVE RUNS AGAINST THE FULL, UNPRUNED node_modules — devDependencies
      # included — so it cannot see the class of bug that took production down on 2026-09-16: a
      # package imported by server.ts at module load time (`libsodium-wrappers`, via
      # `githubSecrets.ts`) that was classified as a devDependency. The Dockerfile's runtime stage
      # runs `npm prune --omit=dev` before shipping the image; the boot-check step here never does,
      # so it passed while the real container crashed before ever binding port 8080. This gate answers
      # the question the boot-check cannot: "does every package the production bundle actually
      # requires survive that prune?" — via esbuild's own AST-accurate metafile, no Docker needed.
      - name: Server production-dependency gate (every runtime import must survive `npm prune --omit=dev`)
        run: npm run deps:server-gate


  # Explicit acceptance for this asset-engine PR only; never a runtime preload or scheduled crawl.
  # Uses ordinary hosted-runner egress and the unchanged connection-level SSRF dispatcher.
  asset-live-acceptance:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/universal-3d-assets' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
      - run: npm ci
      - name: Install isolated browser verification tooling
        id: browser
        run: |
          mkdir -p "$RUNNER_TEMP/asset-acceptance"
          npm install --prefix "$RUNNER_TEMP/asset-browser" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/asset-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "ASSET_PLAYWRIGHT=$RUNNER_TEMP/asset-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          node --input-type=module -e "import {createRequire} from 'node:module';const r=createRequire(process.cwd()+'/package.json');const p=r(process.env.RUNNER_TEMP+'/asset-browser/node_modules/playwright');console.log('ASSET_CHROMIUM='+p.chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Live requested table discovery, secure transfer, browser admission and durable reload
        run: |
          mkdir -p "$RUNNER_TEMP/asset-acceptance"
          node --import ./node_modules/tsx/dist/loader.mjs scripts/checks/gameAssetDemand.check.ts "$RUNNER_TEMP/asset-acceptance/demand" "$ASSET_PLAYWRIGHT" "$ASSET_CHROMIUM" live 2>&1 | tee "$RUNNER_TEMP/asset-acceptance/demand.log"
      - name: Reviewed real models through production downloader, browser and fresh-process cache
        id: reviewed
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: |
          node --import ./node_modules/tsx/dist/loader.mjs scripts/checks/gameAssetReal.check.ts "$RUNNER_TEMP/asset-acceptance/reviewed" "$ASSET_PLAYWRIGHT" "$ASSET_CHROMIUM" 2>&1 | tee "$RUNNER_TEMP/asset-acceptance/reviewed.log"
      - name: Six local game scenarios from admitted bytes and production artifacts
        if: ${{ !cancelled() && steps.reviewed.outcome == 'success' }}
        run: |
          node --import ./node_modules/tsx/dist/loader.mjs scripts/checks/gameAssetScenarios.check.ts "$RUNNER_TEMP/asset-acceptance/scenarios" "$RUNNER_TEMP/asset-acceptance/reviewed/cache/game-assets-public-cc/v1" "$ASSET_PLAYWRIGHT" "$ASSET_CHROMIUM" 2>&1 | tee "$RUNNER_TEMP/asset-acceptance/scenarios.log"
      - name: Upload test evidence only (no model library or public game publication)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asset-acceptance-evidence
          path: |
            ${{ runner.temp }}/asset-acceptance/*.log
            ${{ runner.temp }}/asset-acceptance/demand/*.png
            ${{ runner.temp }}/asset-acceptance/scenarios/*.png
            ${{ runner.temp }}/asset-acceptance/scenarios/results.json
          if-no-files-found: error
