# P-SEC.2 — OWASP ZAP baseline rules for NavBharatAI. Read by .github/workflows/dast.yml.
# Format (TAB-separated, three columns): <ruleId> <TAB> <FAIL|WARN|IGNORE> <TAB> (<reason>)
#
# WHAT EACH ACTION DOES (the workflow passes -I, so a WARN never fails the job):
#   FAIL   — the nightly job goes RED. Only for a finding that is a real, exploitable risk or a leak of
#            data or credentials. Every FAIL rule PASSED on the 2026-09-30 and 2026-10-04 runs, so red
#            means a regression, not noise.
#   WARN   — printed in the job log and the zap_scan artifact; the job stays green.
#   IGNORE — not reported. Only with a written reason why the rule cannot describe a defect of ours.
# A rule NOT listed here is WARN (zap-baseline's default), so a new ZAP rule never turns the job red unseen.
#
# Q-620 (2026-10-05): every rule this ZAP version runs with -a is listed — the 70 rule ids printed by the
# real nightly runs. tests/dastConfigSaysWhatItDoes.test.ts checks this file against the workflow.
#
# 🔴 TWO PARSER FACTS THAT KEEP THIS FILE WORKING (zaproxy/action-baseline v0.15.0 + actions-common):
#   1. The action passes this file to ZAP (-c) ONLY IF it contains at least one IGNORE row. With none,
#      the FAIL rows below would be silently dropped and nothing could ever fail the job.
#   2. A blank line makes the action's reader throw, and it stops reading at that line. Comment lines
#      (starting with #) are fine; blank lines are not. The test enforces both.
#
# ---------------- FAIL: a real, exploitable risk or a leak ----------------
