<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- THE CHECKOUT SDK'S CONNECTION, WARMED BEFORE THE BUTTON IS PRESSED (admin 2026-09-21:
         "button press aur cashfree page par jane me 5-10 second"). The gateway's JS SDK is fetched
         from a THIRD-PARTY origin at the moment of purchase, so that click used to pay for a cold
         DNS lookup + TCP + TLS handshake before a single byte of the script arrived. preconnect
         does that handshake now, in parallel with everything else the page is doing.
         It is a HINT, never a dependency: a browser that ignores it behaves exactly as before, and
         nothing here downloads the script — that is `preloadCheckoutSdk()` in paymentService.ts. -->
    <link rel="preconnect" href="https://sdk.cashfree.com" crossorigin />
    <link rel="dns-prefetch" href="https://sdk.cashfree.com" />
    <!-- Theme (admin 2026-07-14): set data-theme on <html> BEFORE first paint so the app renders in the
         saved theme with no dark→theme flash (FOUC). React keeps it in sync afterwards (App.tsx). -->
    <script>
      try { var t = localStorage.getItem('theme'); if (t === 'dim') t = 'dark'; else if (t === 'comfort') t = 'light'; document.documentElement.setAttribute('data-theme', t === 'light' || t === 'contrast' ? t : 'dark'); } catch (e) {}
      // NATIVE-ONLY: mark <html> and tighten the viewport BEFORE first paint, same reasoning as the
      // theme line above — a class/attribute added after React mounts would let one frame of website
      // behaviour (pinch-enabled) flash before the app-only rules kick in. `window.Capacitor` is
      // injected by the WebView bridge before this script runs, so the check is synchronous and safe
      // on the plain website (Capacitor is simply undefined there). See src/lib/zoomLock.ts and the
      // touch-action rule in src/index.css, which key off the SAME 'nb-native-shell' class.
      try {
        if (window.Capacitor && (typeof window.Capacitor.isNativePlatform !== 'function' || window.Capacitor.isNativePlatform())) {
          document.documentElement.classList.add('nb-native-shell');
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover');
        }
      } catch (e) {}
    </script>
    <!-- viewport replaced below with viewport-fit=cover for PWA -->
    <title>NavBharatAI v5.0 — AI App Maker</title>
    
    <!-- Branding Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NavBharatAI" />

    <!-- Safe-area / notch support. Pinch-zoom stays ALLOWED here by default — the website is a normal
         web page and pinch-zoom is a real accessibility aid (WCAG 1.4.4).

         🔴 CORRECTED 2026-09-14 (admin, verbatim: "mobile app me off karne ko kaha tha, apne website
         par bhi pinch zoom band kar di!") — this tag used to hardcode `maximum-scale=1,
         user-scalable=no` unconditionally, so the WEBSITE lost pinch-zoom along with the installed
         app. The admin's 2026-08-24 ask ("do unglio se jaise webpage zoom karte hai woh zoom app me
         nahi hona chahiye") was about the APP, not the website. `user-scalable=no` is the ANDROID half
         of that answer (iOS has ignored it since Safari 10, on purpose) — so it is now added by JS,
         ONLY inside the native shell, in the SAME inline script that sets the theme before first paint
         (see below). `src/lib/zoomLock.ts` (the iOS `gesturestart` blocker) and the `touch-action`
         rule in `src/index.css` are the other two layers, and both are now native-gated the same way —
         see those files for why all three are needed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Open Graph (Metadata for WhatsApp, Telegram, Discord link sharing) -->
    <meta property="og:title" content="NavBharatAI v5.0" />
    <meta property="og:description" content="नए भारत का अपना AI - Sovereign Intelligent Enterprise Architect Console" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://navbharatai.com" />
    
    <!-- Twitter Card (Twitter/X preview metadata) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NavBharatAI v5.0" />
    <meta name="twitter:description" content="नए भारत का अपना AI - Sovereign Intelligent Enterprise Architect Console" />
    <meta name="twitter:image" content="/logo.png" />
  </head>
  <body>
    <!-- 🔴 THE FIRST FRAME, AND WHY IT IS HTML RATHER THAN REACT (2026-09-19, measured).
         `<div id="root"></div>` was empty, so NOTHING could paint until the whole module graph had
         arrived and run. Measured on an emulated slow-4G link with a mid-range phone CPU: first
         contentful paint at **3.1 seconds**, 536 KB over the wire, four render-blocking assets — and
         for all three seconds a user sees a blank page that answers nothing they do to it.

         This markup is inside `#root` on purpose: `createRoot(...).render()` replaces the container's
         children on its first commit, so React removes it with no teardown code, no timer and no flag
         that could leave it stranded on screen. There is nothing to un-mount and nothing to forget.

         🔒 IT IS A LOADING STATE, NOT A FAKE UI. It carries the product name and says it is starting —
         no buttons that do nothing, no mocked content, nothing that claims the app is ready when it is
         not. Honesty here is the same rule the rest of the codebase follows about never showing a
         result that has not happened.

         ⚠️ AND WHAT IT DOES NOT DO, stated so nobody reads more into it: this makes the app *paint*
         sooner. It does not make it *interactive* sooner — the JavaScript still has to arrive before
         anything responds. The levers for that are recorded in PROGRESS.md.

         Styles are INLINE, in a <style> the parser sees with the HTML, so this frame is not waiting on
         the 42 KB stylesheet either. The colours are the real `--surface-base` / `--text-primary`
         values from src/index.css for each theme, keyed off the same `data-theme` the script above has
         already set — so when the real CSS lands the background does not change colour. -->
    <style>
      #nbai-boot { position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #0d1117; color: #ffffff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      [data-theme="light"] #nbai-boot { background: #f8fafc; color: #0f172a; }
      [data-theme="contrast"] #nbai-boot { background: #000000; color: #ffff00; }
      #nbai-boot .nbai-boot-name { font-size: 15px; font-weight: 900; letter-spacing: 0.18em;
        text-transform: uppercase; }
      #nbai-boot .nbai-boot-note { font-size: 12px; opacity: 0.65; }
      #nbai-boot .nbai-boot-ring { width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid currentColor; border-top-color: transparent; opacity: 0.55;
        animation: nbai-boot-spin 0.9s linear infinite; }
      @keyframes nbai-boot-spin { to { transform: rotate(360deg); } }
      /* A spinner is decoration; someone who has asked for less motion gets a still ring. */
      @media (prefers-reduced-motion: reduce) { #nbai-boot .nbai-boot-ring { animation: none; } }
    </style>
    <div id="root"><div id="nbai-boot" role="status" aria-live="polite">
      <div class="nbai-boot-ring"></div>
      <div class="nbai-boot-name">NavBharatAI</div>
      <div class="nbai-boot-note">Starting up&hellip;</div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
