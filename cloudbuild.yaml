# Google Cloud Build Pipeline Configuration (cloudbuild.yaml)
# Orchestrated by navBharat AI for enterprise-scale Docker integration.

steps:
  # P-BRE.5 — Remote build cache. Warm the BuildKit layer cache from the previous `:latest` image in
  # the registry (the registry IS the remote cache — no extra GCS bucket needed). Non-fatal: on the
  # very first build (no `:latest` yet) or a registry hiccup this exits 0 so the deploy never breaks.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull gcr.io/$PROJECT_ID/navbharat-cloud-run:latest || exit 0'

  # Step 1: Build the optimized container image, reusing cached layers (esp. the `npm ci` layer when
  # package*.json is unchanged → cold build drops from ~5 min toward ~2 min). BUILDKIT_INLINE_CACHE
  # bakes cache metadata into the pushed image so the NEXT build can `--cache-from` it.
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'
      - '.'

  # Step 2: Push the container image directly to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'

  # Step 3: Push the stable latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'

  # Step 4: Deploy the immutable image revision to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'navbharat-ai-prod'
      - '--image'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--update-env-vars'
      - 'NODE_ENV=production'
      - '--allow-unauthenticated'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '3600'
      - '--concurrency'
      - '100'
      - '--cpu-boost'
      - '--execution-environment'
      - 'gen2'
      - '--quiet'
  # P2.4 — Disaster Recovery. The app exposes liveness (/api/live) and readiness
  # (/api/ready) probes. Wire them into the Cloud Run service with the documented
  # one-time command in docs/DR_RUNBOOK.md §3 (gcloud run services update --startup-probe
  # / --liveness-probe). They are applied manually (operator watches the deploy succeed)
  # rather than on this unattended deploy step — a wrong probe flag here would fail the
  # auto-deploy. Once applied, the probe config persists across image-only deploys.
  # Scheduled Firestore backups + restore are documented in docs/DR_RUNBOOK.md §1–§2.
  # P3.3 — Scalability/HA. min-instances stays 0 (budget). Cold starts are mitigated by
  # GET /api/warm + an external Cloud Scheduler ping (no self-ping); see docs/SCALABILITY.md
  # §1. Multi-region readiness (config-only, no spend yet) is assessed in docs/SCALABILITY.md §2.

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'
