name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit gate (P-TQA.7 — BLOCKS new high/critical; allowlist for triaged advisories)
        run: npm run audit:gate

      - name: Supply-chain provenance (P-SEC.10 — npm package signatures; informational, never blocks)
        run: npm audit signatures
        continue-on-error: true

      - name: License compliance gate (P-SEC.6 — BLOCKS new strong-copyleft GPL/AGPL)
        run: npm run license:gate

      - name: Generate SBOM (P-SEC.6 — CycloneDX)
        run: npm run sbom

      - name: Upload SBOM artifact (P-SEC.6)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn

      - name: Typecheck (frontend)
        run: npm run typecheck

      - name: Typecheck (server modules - strict guardrail)
        run: npm run typecheck:server

      - name: Test
        run: npm test

      - name: Build (frontend bundle + server bundle — catches build-only breaks)
        run: npm run build

      - name: Bundle size budget (P-TQA.5 — fail on bundle bloat)
        run: npm run test:bundle

      - name: Boot smoke-check (server starts without crash)
        run: npm run boot:check
