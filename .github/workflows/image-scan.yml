name: Container Image Scan (Trivy)

# P-SEC.4 — Build the production Docker image and scan it for OS/base-image CVEs.
# Runs nightly + on-demand (NOT per-PR/deploy: building+scanning the image is slow,
# and we must never add a surprise hard-block to the deploy pipeline). Fails only on
# CRITICAL (genuinely block-worthy, rare); HIGH and below are reported, not failed.
on:
  schedule:
    - cron: '30 3 * * *'   # nightly 03:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trivy-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t navbharatai:scan .

      # NO ACTION, ON PURPOSE. This workflow has now broken TWICE for reasons that had nothing to do
      # with our security posture: first the pinned action tag was deleted upstream (job died at "Unable
      # to resolve action" — the image was never scanned at all), then the newer action's own contract
      # changed and both steps failed in ~2s, including the report-only one, which cannot fail on a CVE.
      # Each time the red X looked exactly like a CVE finding, so the signal saying "your scanner is
      # broken" read as "your container has a problem" — and neither got read.
      #
      # Trivy is now invoked DIRECTLY from its official image, pinned. There is no third-party action
      # between us and the scanner, so an upstream release can no longer change what this job does, and
      # any failure prints Trivy's own error instead of an action wrapper's. The DB cache is persisted so
      # a rate-limited download does not turn into a mystery failure. Tag verified to exist (2026-08-04).
      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Trivy scan — FAIL on CRITICAL
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.73.0 image \
              --scanners vuln \
              --severity CRITICAL \
              --ignore-unfixed \
              --format table \
              --exit-code 1 \
              navbharatai:scan

      - name: Trivy scan — report HIGH (non-blocking)
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.73.0 image \
              --scanners vuln \
              --severity HIGH \
              --ignore-unfixed \
              --format table \
              --exit-code 0 \
              navbharatai:scan
