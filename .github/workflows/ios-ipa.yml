# Build the SIGNED NavBharatAI iOS app (.ipa) for the Apple App Store / TestFlight — WITHOUT owning a Mac.
#
# WHY A WORKFLOW: an iOS build legally requires macOS + Xcode (Apple's hard rule). GitHub's macOS runners
# ARE real Macs in the cloud, so this workflow does the whole iOS build/sign/upload there — you never need
# to own a Mac. The one thing only you can provide is your Apple identity; we take it as an **App Store
# Connect API key** (a .p8 file you create on the web — no Mac, no Keychain, no certificate wrangling).
# With that one key, Xcode on the runner AUTOMATICALLY creates the distribution certificate + provisioning
# profile (`-allowProvisioningUpdates`), so there is nothing else to generate by hand.
#
# ONE-TIME SETUP (all on the web — no Mac needed):
#   A. App Store Connect → Users and Access → Integrations → App Store Connect API → generate an API key
#      with the "Admin" role (App Manager CANNOT create the distribution certificate for App Store cloud signing). Download the `AuthKey_XXXXXX.p8` (you can download it ONCE — keep it safe).
#      Note the Key ID (e.g. ABC123DEF4) and the Issuer ID (a UUID shown at the top of the Keys page).
#   B. Apple Developer → Membership → copy your Team ID (10 chars, e.g. 9ABCD1EFGH).
#   C. App Store Connect → My Apps → + → New App → Bundle ID `com.navbharat.ai`, name "NavBharatAI"
#      (create the app record ONCE so uploads have somewhere to land).
#   D. Repo → Settings → Secrets and variables → Actions → add 4 secrets:
#        IOS_ASC_KEY_ID        = the Key ID (e.g. ABC123DEF4)
#        IOS_ASC_ISSUER_ID     = the Issuer ID (the UUID)
#        IOS_ASC_KEY_BASE64    = EITHER the raw AuthKey_XXXXXX.p8 file contents pasted directly (open it in
#                                a text editor and paste ALL of it, the -----BEGIN/END PRIVATE KEY----- lines
#                                included — easiest, no encoding step) OR its base64 (`base64 -i AuthKey.p8`).
#        IOS_TEAM_ID           = your Team ID from step B
#
# ⭐ RECOMMENDED — PERSISTENT DISTRIBUTION CERT (fixes the "reached the maximum number of available
#   Distribution certificates" cap). Without this, the build MINTS A NEW distribution cert every run;
#   Apple allows only 2, so after two runs every build fails. Provide ONE reusable cert instead — all on
#   the web + the `openssl` CLI (no Mac):
#     1. Apple Developer → Certificates → REVOKE any stale/unused "Apple Distribution" certs so a slot is free
#        (they are safe to revoke — already-shipped App Store builds are unaffected).
#     2. Make a private key + CSR (any machine with openssl):
#          openssl genrsa -out dist.key 2048
#          openssl req -new -key dist.key -out dist.csr -subj "/CN=NavBharatAI Distribution/O=NavBharatAI"
#     3. Apple Developer → Certificates → + → "Apple Distribution" → upload dist.csr → download the .cer.
#     4. Convert cert to PEM, then bundle key + cert into a password-protected .p12:
#          openssl x509 -inform der -in distribution.cer -out dist.pem
#          openssl pkcs12 -export -inkey dist.key -in dist.pem -out dist.p12 -passout pass:YOUR_P12_PASSWORD
#     5. base64 the .p12 and add TWO more repo secrets:
#          IOS_DIST_CERT_P12_BASE64 = base64 -i dist.p12    (macOS)  /  base64 -w0 dist.p12  (linux)
#          IOS_DIST_CERT_PASSWORD   = YOUR_P12_PASSWORD
#   With these set, the Fastfile imports + reuses this ONE cert every run — the cap is never hit again.
#   (Leave them unset to keep the old mint-per-run behavior.)
#
# HOW TO RUN:
#   Repo → Actions → "Build iOS App (.ipa, signed)" → Run workflow (main).
#   - Leave "upload" unchecked to just BUILD + download the .ipa artifact (a dry run to confirm signing works).
#   - Check "upload" to send the build straight to TestFlight/App Store Connect after building.
#
# HONEST NOTE: iOS code-signing on CI is fussier than Android. If the first run fails on a signing step,
# it fails LOUDLY (never a fake success) — read the error, and it's almost always a wrong Team ID, an API
# key without the "Admin" role (needed to create the distribution certificate), or the app record (step C) not created yet.

name: Build iOS App (.ipa, signed)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the build to App Store Connect / TestFlight after building'
        type: boolean
        default: false
      apple_signin:
        # DEFAULT TRUE (root-cause fix, admin 2026-07-20): "Sign in with Apple" is a SHIPPED user-facing
        # capability. When this defaulted to false, a routine rebuild triggered without inputs silently
        # dropped the applesignin entitlement and broke Apple login for every updated user (real
        # incident: the 2026-07-20 rebuild). A shipped capability must be opt-OUT, never opt-in.
        # Prerequisites (App-ID capability + Firebase Apple provider) are one-time and already done.
        description: 'Include native "Sign in with Apple" (default ON — it is a shipped capability; untick only to intentionally build without it)'
        type: boolean
        default: true
      changelog:
        description: 'TestFlight "What to Test" note for this build (optional — defaults to the build number)'
        type: string
        default: ''
      enable_push_notifications:
        # OPT-IN, default OFF (admin 2026-07-26 — push notifications just built, see MOBILE_PUBLISHING.md
        # §7.5). Unlike apple_signin above this does NOT default to true, because its prerequisite (the
        # Push Notifications capability on the com.navbharat.ai App ID + an APNs key uploaded to Firebase
        # Console) has not been done yet — defaulting ON here would break the FIRST build for anyone who
        # hasn't done that one-time setup. Flip the default to true (like apple_signin) once it's proven.
        description: 'Include the push-notifications entitlement (needs the one-time Apple Developer + Firebase Console setup in MOBILE_PUBLISHING.md §7.5 first — leave OFF until that''s done)'
        type: boolean
        default: false

jobs:
  build-ios:
    # macos-15 (Sequoia) is a real Mac in the cloud. It ships multiple Xcodes including Xcode 26 (which runs
    # on macOS 15.6+). We select the NEWEST one because Apple now REJECTS App Store uploads built with an SDK
    # older than iOS 26 ("must be built with the iOS 26 SDK or later, included in Xcode 26 or later"). The
    # newest Xcode also satisfies the @capacitor-firebase/authentication SPM requirement (Swift 6.1+), so
    # newest-wins is strictly better than the old "pin Xcode 16".
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Select the newest installed Xcode. Apple requires Xcode 26+ (iOS 26 SDK) to upload to App Store
      # Connect — fail early and loudly if this runner's newest Xcode is older, rather than building an
      # .ipa that Apple will reject only at the upload step (as build #10 did).
      - name: Select the newest Xcode (Apple requires Xcode 26+ / iOS 26 SDK to upload)
        run: |
          LATEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LATEST" ]; then
            echo "::error::No Xcode found on the runner. Installed Xcodes:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version | head -2
          # Apple rejects uploads built with an SDK older than iOS 26. Fail early (before the long build) if
          # the newest Xcode on this runner is < 26, so we don't waste an archive on an .ipa Apple will refuse.
          MAJOR="$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')"
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 26 ]; then
            echo "::error::Newest Xcode on this runner is '$MAJOR' — Apple requires Xcode 26+ (iOS 26 SDK) to upload to App Store Connect. Change the runner image to one that ships Xcode 26. Installed Xcodes:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi

      # Fail EARLY and honestly if the Apple secrets are not set — a store .ipa MUST be signed with your
      # Apple identity, so we never hand back an unsigned/unusable build.
      - name: Pre-flight — require Apple signing secrets
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_ASC_KEY_BASE64: ${{ secrets.IOS_ASC_KEY_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=""
          [ -z "$IOS_ASC_KEY_ID" ] && missing="$missing IOS_ASC_KEY_ID"
          [ -z "$IOS_ASC_ISSUER_ID" ] && missing="$missing IOS_ASC_ISSUER_ID"
          [ -z "$IOS_ASC_KEY_BASE64" ] && missing="$missing IOS_ASC_KEY_BASE64"
          [ -z "$IOS_TEAM_ID" ] && missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing Apple signing secret(s):$missing — add them in Settings → Secrets and variables → Actions (see the header of this workflow file for the one-time web setup)."
            exit 1
          fi
          echo "All Apple signing secrets present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        run: npm run build

      # The ios/ native project is NOT committed (it is generated per-machine). Generate it fresh here.
      # `cap add ios` is a no-op if it already exists, so this is safe either way.
      - name: Generate & sync the Capacitor iOS project
        run: |
          npx cap add ios || echo "ios/ already present — continuing"
          npx cap sync ios

      # Real app icon (Apple App Review Guideline 2.3.8 — iOS v1.0(46) was rejected because the icon was a
      # PLACEHOLDER: `cap add ios` scaffolds the project with Capacitor's default icon and nothing replaced
      # it). Capacitor 8's iOS project uses a SINGLE 1024x1024 universal icon, so we overwrite every PNG in
      # the generated AppIcon.appiconset with our real, verified 1024x1024 no-alpha brand icon
      # (ios-config/app-icon.png, built by scripts/make-app-icon.py). Fail LOUDLY if the icon set or our
      # source is missing — never silently ship the placeholder again.
      - name: Replace placeholder app icon with the real NavBharatAI icon (Apple 2.3.8)
        run: |
          set -e
          SRC="ios-config/app-icon.png"
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -f "$SRC" || { echo "::error::Missing $SRC (the real app icon source)"; exit 1; }
          test -d "$ICONSET" || { echo "::error::AppIcon.appiconset not found at $ICONSET"; exit 1; }
          shopt -s nullglob
          pngs=("$ICONSET"/*.png)
          if [ ${#pngs[@]} -eq 0 ]; then echo "::error::No icon PNG found in $ICONSET"; exit 1; fi
          for f in "${pngs[@]}"; do cp "$SRC" "$f"; done
          echo "Replaced ${#pngs[@]} icon file(s) in $ICONSET with the real NavBharatAI icon:"
          ls -la "$ICONSET"

      # SPLASH SCREEN — the same placeholder problem as the icon above, one step further into the launch.
      #
      # ADMIN REPORT 2026-08-16: "app open karte hai to 0.5 second ke liye Capacitor logo screen par aata
      # hai". `cap add ios` scaffolds Splash.imageset with Capacitor's own artwork, and while the icon step
      # above was added when Apple flagged the placeholder icon, NOTHING ever replaced the splash — so every
      # iOS launch flashed someone else's logo. Android never showed it because its splash PNGs are
      # committed (drawable*/splash.png, 2026-08-11), which is why this was an iPhone-only symptom.
      #
      # ios-config/splash.png is generated by scripts/make-ios-splash.py FROM the shipping Android splash,
      # so both platforms show the identical lockup on the identical background. Fail LOUDLY if either the
      # source or the image set is missing — shipping the placeholder silently is what got us here.
      - name: Replace placeholder splash screen with the NavBharatAI splash
        run: |
          set -e
          SRC="ios-config/splash.png"
          SPLASHSET="ios/App/App/Assets.xcassets/Splash.imageset"
          test -f "$SRC" || { echo "::error::Missing $SRC (run scripts/make-ios-splash.py and commit it)"; exit 1; }
          test -d "$SPLASHSET" || { echo "::error::Splash.imageset not found at $SPLASHSET"; exit 1; }
          shopt -s nullglob
          pngs=("$SPLASHSET"/*.png)
          if [ ${#pngs[@]} -eq 0 ]; then echo "::error::No splash PNG found in $SPLASHSET"; exit 1; fi
          # Capacitor's set holds @1x/@2x/@3x entries that all reference the same artwork, so every one is
          # overwritten with our 2732x2732 image — exactly the approach the icon step above uses.
          for f in "${pngs[@]}"; do cp "$SRC" "$f"; done
          echo "Replaced ${#pngs[@]} splash file(s) in $SPLASHSET with the NavBharatAI splash:"
          ls -la "$SPLASHSET"

      # Firebase iOS config. The @capacitor-firebase/authentication plugin calls FirebaseApp.configure()
      # at launch, which reads GoogleService-Info.plist from the app bundle — WITHOUT it the app CRASHES
      # on launch (TestFlight build #12 did exactly this; Android is fine because it ships
      # google-services.json). The committed ios-config/GoogleService-Info.plist is registered for the iOS
      # app (bundle com.navbharat.ai) in the same Firebase project the web app authenticates against
      # (gen-lang-client-0866594388). We (1) copy it into the generated project, (2) add it to the Xcode
      # target's resources so it lands at the bundle root where FirebaseApp.configure() looks, and (3) add
      # its REVERSED_CLIENT_ID as a URL scheme so native Google Sign-In can return to the app.
      - name: Add Firebase iOS config (GoogleService-Info.plist + Google Sign-In URL scheme)
        run: |
          set -e
          cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          # 1) Reference the plist in the App target's resources build phase (idempotent).
          gem install xcodeproj --no-document --quiet
          ruby - <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = proj.targets.find { |t| t.name == 'App' } or abort('App target not found')
          group = proj.main_group.find_subpath('App', false) or abort('App group not found')
          name = 'GoogleService-Info.plist'
          unless group.files.any? { |f| f.display_name == name }
            ref = group.new_reference(name)
            target.resources_build_phase.add_file_reference(ref, true)
          end
          proj.save
          puts "OK: GoogleService-Info.plist referenced in the App target."
          RUBY
          # 2) Add the Google Sign-In callback URL scheme (REVERSED_CLIENT_ID) to Info.plist.
          PLIST="ios/App/App/Info.plist"
          RID="$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/App/App/GoogleService-Info.plist)"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          # Append a fresh URL-type entry (count existing entries to get the next index).
          n=0; while /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:$n" "$PLIST" >/dev/null 2>&1; do n=$((n+1)); done
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$n dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$n:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$n:CFBundleURLSchemes:0 string $RID" "$PLIST"
          echo "Firebase iOS config in place; Google Sign-In URL scheme = $RID"

          # 3) Add the GitHub-OAuth-return custom scheme (com.navbharat.ai) so the in-app browser can
          #    deep-link the token back INTO the app (matches the Android intent-filter + the server's
          #    NATIVE_OAUTH_REDIRECT). Without this, iOS GitHub login would strand the user in the browser.
          m=0; while /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:$m" "$PLIST" >/dev/null 2>&1; do m=$((m+1)); done
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$m dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$m:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$m:CFBundleURLSchemes:0 string com.navbharat.ai" "$PLIST"
          echo "GitHub OAuth return URL scheme = com.navbharat.ai"

      # ROOT-CAUSE FIX for "Google login succeeds → redirect back → INFINITE LOADING" (admin iPhone
      # report 2026-07-17): the GoogleSignIn iOS SDK REQUIRES the app to forward the auth-redirect URL to
      # GIDSignIn.sharedInstance.handle(url) from application(_:open:options:) — that call is what
      # completes the sign-in and fires the plugin's callback. Capacitor's generated AppDelegate only
      # forwards the URL to ApplicationDelegateProxy (and @capacitor-firebase/authentication has NO URL
      # handler of its own — verified in its source), so the SDK never learned the login finished and the
      # JS promise hung forever. Because ios/ is regenerated fresh on every build, we inject the wiring
      # here, exactly like the plist/permissions steps. canImport keeps it compile-safe.
      - name: Wire the Google Sign-In redirect into AppDelegate (fixes infinite login)
        run: |
          set -e
          AD="ios/App/App/AppDelegate.swift"
          if grep -q "GIDSignIn.sharedInstance.handle" "$AD"; then
            echo "AppDelegate already wired — skipping."
            exit 0
          fi
          # 1) Import GoogleSignIn (guarded so the file still compiles if the module ever moves).
          sed -i '' '1s/^/#if canImport(GoogleSignIn)\nimport GoogleSignIn\n#endif\n/' "$AD"
          # 2) Hand the redirect URL to GIDSignIn BEFORE the generic Capacitor proxy. Only the real code
          #    line is matched (leading whitespace + return), never the template's commented example.
          perl -0pi -e 's/(\n\s*)(return ApplicationDelegateProxy\.shared\.application\(app, open: url, options: options\))/$1#if canImport(GoogleSignIn)$1if GIDSignIn.sharedInstance.handle(url) \{$1    return true$1\}$1#endif$1$2/' "$AD"
          grep -q "GIDSignIn.sharedInstance.handle" "$AD" || { echo "::error::AppDelegate patch failed — the template changed. Fix the injection."; exit 1; }
          echo "AppDelegate wired:"; grep -n -A3 "GIDSignIn" "$AD" | head -12

      # Native "Sign in with Apple" (OPT-IN — off by default so the proven Google-only build is never at
      # risk). When enabled, this declares the com.apple.developer.applesignin entitlement + points the
      # App target at it; the Fastfile's `sigh force:true` then regenerates a provisioning profile that
      # carries the entitlement. PREREQUISITES (one-time, done by hand — see MOBILE_PUBLISHING.md §4.5):
      #   1. Apple Developer → Identifiers → com.navbharat.ai → "Sign In with Apple" ✅  (so the profile
      #      sigh creates includes the entitlement — else export fails "profile doesn't include
      #      com.apple.developer.applesignin"). We do NOT automate this with `produce` (it doesn't accept
      #      an App Store Connect api_key and failed the build); the App-ID checkbox is reliable.
      #   2. Firebase Console → Authentication → Sign-in method → Apple → Enable (else Apple login errors
      #      at runtime even with a perfectly signed build).
      - name: Enable "Sign in with Apple" entitlement (opt-in)
        if: ${{ inputs.apple_signin }}
        run: |
          set -e
          ENT="ios/App/App/App.entitlements"
          # Create a minimal, VALID plist if the template didn't ship one (printf → no leading-whitespace
          # before <?xml, which a heredoc inside this YAML block would have introduced and broken).
          if [ ! -f "$ENT" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict></dict></plist>' > "$ENT"
          fi
          # Idempotent add of the applesignin entitlement (array with a single "Default" string).
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin" "$ENT" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$ENT"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" "$ENT" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string Default" "$ENT"
          # Point every build config of the App target at the entitlements file (xcodeproj gem was
          # installed in the Firebase-config step above).
          ruby - <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = proj.targets.find { |t| t.name == 'App' } or abort('App target not found')
          target.build_configurations.each do |c|
            c.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end
          proj.save
          puts 'OK: App.entitlements wired to the App target (Sign in with Apple).'
          RUBY
          echo "Sign in with Apple entitlement in place."

      # Push notifications (OPT-IN — off by default, see the workflow_dispatch input above). Declares the
      # aps-environment entitlement Apple requires for ANY push capability. PREREQUISITES (one-time, done
      # by hand — see MOBILE_PUBLISHING.md §7.5, same pattern as the Sign in with Apple prerequisites
      # above): (1) Apple Developer → Identifiers → com.navbharat.ai → "Push Notifications" ✅ (so the
      # profile `sigh` creates includes the entitlement), (2) Firebase Console → Project Settings → Cloud
      # Messaging → Apple app configuration → upload an APNs Authentication Key (so Firebase can actually
      # deliver to APNs on our behalf — @capacitor-firebase/messaging's iOS side routes through Firebase,
      # so this step is required even though we're not calling raw APNs ourselves).
      - name: Enable push-notifications entitlement (opt-in)
        if: ${{ inputs.enable_push_notifications }}
        run: |
          set -e
          ENT="ios/App/App/App.entitlements"
          if [ ! -f "$ENT" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict></dict></plist>' > "$ENT"
          fi
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT"
          gem install xcodeproj --no-document --quiet
          ruby - <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = proj.targets.find { |t| t.name == 'App' } or abort('App target not found')
          target.build_configurations.each do |c|
            c.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end
          proj.save
          puts 'OK: App.entitlements wired to the App target (push notifications).'
          RUBY
          echo "Push-notifications entitlement in place."

      # App Store REQUIRES a purpose string for every device permission the app can request, or review
      # REJECTS the binary (and iOS crashes on the first getUserMedia call without it). The app uses the
      # MICROPHONE (Sonic voice) + CAMERA + photo library (image attach) — same permissions as the
      # committed Android manifest (RECORD_AUDIO + CAMERA). Because ios/ is generated fresh above, its
      # default Info.plist has none of these, so we inject them here (idempotent Add-or-Set) into the
      # generated project. PlistBuddy ships on every macOS runner.
      - name: Inject iOS permission usage descriptions (App Store requires them)
        run: |
          PLIST="ios/App/App/Info.plist"
          set_key() {
            /usr/libexec/PlistBuddy -c "Add :$1 string \"$2\"" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 \"$2\"" "$PLIST"
          }
          set_key NSMicrophoneUsageDescription "NavBharatAI uses the microphone for voice conversations with the AI assistant."
          set_key NSCameraUsageDescription "NavBharatAI uses the camera to capture and scan images inside the app."
          set_key NSPhotoLibraryUsageDescription "NavBharatAI uses your photo library to attach images to your builds."
          set_key NSPhotoLibraryAddUsageDescription "NavBharatAI can save generated images to your photo library."
          # Export compliance: the app uses ONLY standard HTTPS/TLS (exempt encryption) and implements no
          # proprietary/custom crypto, so it uses no non-exempt encryption. Declaring this in Info.plist
          # (a BOOLEAN, not a string) makes App Store Connect skip the "App Encryption Documentation" popup
          # on every TestFlight upload — the permanent equivalent of answering "None of the algorithms".
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # Unique, monotonically-increasing build number. Apple rejects a re-used CFBundleVersion — build
          # #13's upload failed with "bundle version must be higher than the previously uploaded version: 1"
          # because every build defaulted to "1". Stamp it with the workflow run number (always increases),
          # exactly like the Android .aab auto-increments versionCode = run number.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}" "$PLIST"
          echo "Usage descriptions now in Info.plist:"
          for k in NSMicrophoneUsageDescription NSCameraUsageDescription NSPhotoLibraryUsageDescription; do
            printf '  %s = %s\n' "$k" "$(/usr/libexec/PlistBuddy -c "Print :$k" "$PLIST")"
          done
          printf '  %s = %s\n' ITSAppUsesNonExemptEncryption "$(/usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST")"

      # Write the App Store Connect API key (.p8) where xcodebuild AND altool both look for it.
      #
      # ROBUST NORMALIZATION (2026-07-15): builds #7/#8 failed with Apple's "Authentication credentials are
      # missing or invalid" at the very first API call. That error means the signed JWT did not verify — the
      # two overwhelming causes are (a) the pasted .p8 lost its line breaks so the key body is corrupt (the old
      # BEGIN-header check still passed, masking it), or (b) the Key ID / Issuer ID are swapped or typo'd. This
      # step now (1) rebuilds a CANONICAL PEM from whatever was pasted — single-line, space-mangled, or base64 —
      # so paste corruption can't survive, (2) parses it with openssl to prove it is a real private key, and
      # (3) validates the Key ID + Issuer ID shape, failing with a precise message naming the wrong one.
      - name: Install & validate App Store Connect API key
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_ASC_KEY_BASE64: ${{ secrets.IOS_ASC_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          DEST="$HOME/.appstoreconnect/private_keys/AuthKey_${IOS_ASC_KEY_ID}.p8"

          # 1) Get the raw PEM text — accept a directly-pasted .p8 (contains BEGIN) OR base64 of the .p8 file.
          RAW="$IOS_ASC_KEY_BASE64"
          if ! printf '%s' "$RAW" | grep -q 'BEGIN PRIVATE KEY'; then
            RAW="$(printf '%s' "$RAW" | tr -d '[:space:]' | base64 -d 2>/dev/null || true)"
          fi
          if ! printf '%s' "$RAW" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::IOS_ASC_KEY_BASE64 is neither a valid .p8 (no -----BEGIN PRIVATE KEY----- header) nor base64 of one. Paste the ENTIRE AuthKey_*.p8 file contents (BEGIN/END lines included), or its base64."
            exit 1
          fi

          # 2) Rebuild a CANONICAL PEM: strip header/footer + ALL whitespace to recover the pure base64 body,
          #    then re-wrap at 64 cols. This makes a single-line or space-mangled paste produce a valid key.
          BODY="$(printf '%s' "$RAW" \
            | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' \
            | tr -d '[:space:]')"
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo ""
            echo "-----END PRIVATE KEY-----"
          } > "$DEST"

          # 3) Prove it is a real private key (openssl prints nothing on success — no secret leaks to the log).
          if ! openssl pkey -in "$DEST" -noout 2>/dev/null; then
            echo "::error::The App Store Connect key in IOS_ASC_KEY_BASE64 is not a valid private key even after normalization. It is likely truncated or the wrong file was pasted. Re-copy the ENTIRE contents of your AuthKey_XXXX.p8 (every character between and including the BEGIN/END lines) into the secret."
            exit 1
          fi

          # 4) Validate the two IDs (masked in logs — we only echo PASS/FAIL, never the value). The #1 human
          #    error is putting the 10-char Key ID into the Issuer ID field: the Issuer ID is a UUID.
          if ! printf '%s' "$IOS_ASC_ISSUER_ID" | grep -qiE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::IOS_ASC_ISSUER_ID is not a UUID. It must be the *Issuer ID* shown at the TOP of App Store Connect → Users and Access → Integrations → App Store Connect API (a long id with dashes like 69a6de70-1234-...), NOT the short Key ID."
            exit 1
          fi
          if ! printf '%s' "$IOS_ASC_KEY_ID" | grep -qE '^[A-Za-z0-9]{8,12}$'; then
            echo "::error::IOS_ASC_KEY_ID does not look like a Key ID (it should be ~10 letters/digits, e.g. ABC123DEF4 — the 'KEY ID' column next to the key you generated)."
            exit 1
          fi
          echo "API key normalized and parsed OK; Key ID + Issuer ID shape valid."

          # Also drop a copy in RUNNER_TEMP for the explicit -authenticationKeyPath below.
          cp "$DEST" "$RUNNER_TEMP/AuthKey_${IOS_ASC_KEY_ID}.p8"

      # Build + sign + upload via fastlane (fastlane/Fastfile). WHY fastlane instead of raw xcodebuild:
      # `xcodebuild -exportArchive` could not create the iOS Distribution certificate on a fresh runner
      # ("No signing certificate 'iOS Distribution' found"). fastlane's cert+sigh recipe explicitly
      # CREATES the distribution certificate + App Store profile with the API key (Admin role) and signs
      # manually — the proven CI path. NOTE: Capacitor 7+ uses SPM (not CocoaPods), so `cap add ios`
      # generates App.xcodeproj (no .xcworkspace); the Fastfile builds the .xcodeproj.
      - name: Build, sign & upload to TestFlight (fastlane)
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          # Persistent distribution cert (optional). When set, the Fastfile REUSES this one cert every run
          # instead of minting a new one — the fix for Apple's "reached the maximum number of available
          # Distribution certificates" cap. Unset ⇒ the Fastfile falls back to creating a cert per run.
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          DO_UPLOAD: ${{ inputs.upload }}
          # Optional TestFlight delivery controls. IOS_CHANGELOG = the "What to Test" note testers see
          # (defaults to the build number). IOS_TESTFLIGHT_GROUPS (a repo secret) = comma-separated EXTERNAL
          # TestFlight group names; when set, each build is submitted + notified to those external testers.
          # Unset ⇒ internal testers only, who receive every processed build automatically.
          IOS_CHANGELOG: ${{ inputs.changelog }}
          IOS_TESTFLIGHT_GROUPS: ${{ secrets.IOS_TESTFLIGHT_GROUPS }}
          # Opt-in native Apple sign-in: when true, the Fastfile enables the App-ID capability via produce
          # before sigh so the profile includes com.apple.developer.applesignin.
          APPLE_SIGNIN: ${{ inputs.apple_signin }}
          # Opt-in push notifications: when true, forces sigh to regenerate the provisioning profile so
          # it picks up the aps-environment entitlement injected above.
          ENABLE_PUSH: ${{ inputs.enable_push_notifications }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${IOS_ASC_KEY_ID}.p8"
          fastlane ios beta

      - name: Upload the .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: navbharatai-release-ipa
          path: ${{ runner.temp }}/NavBharatAI.ipa
          retention-days: 14

      # The API key is a secret — never let it linger on the runner beyond this job.
      - name: Always remove the API key (never leaves the runner)
        if: always()
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${IOS_ASC_KEY_ID}.p8" || true
          rm -f "$RUNNER_TEMP/AuthKey_${IOS_ASC_KEY_ID}.p8" || true

      - name: Summary
        run: |
          echo "## NavBharatAI signed .ipa built ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.upload }}" = "true" ]; then
            echo "Uploaded to **App Store Connect** — it will appear under TestFlight in a few minutes (Apple processes the build)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Download the **navbharatai-release-ipa** artifact above. To publish, re-run with **upload** checked (sends it to TestFlight/App Store Connect)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle id \`com.navbharat.ai\` · bundled mode runs from this build (API calls still hit navbharatai.com) — auth and all features work unchanged." >> "$GITHUB_STEP_SUMMARY"
