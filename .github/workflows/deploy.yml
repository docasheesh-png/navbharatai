name: Deploy to Cloud Run

# Auto-deploys the app to Google Cloud Run whenever main is updated, so a merge
# to main goes live without a manual `gcloud builds submit`. Uses the existing
# cloudbuild.yaml pipeline (build → push → deploy to service navbharat-ai-prod).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   GCP_PROJECT_ID  — your Google Cloud project id
#   GCP_SA_KEY      — JSON key of a service account with roles:
#                       Cloud Build Editor, Cloud Run Admin, Service Account User,
#                       Artifact Registry Writer (or Storage Admin for gcr.io)
#
# If these secrets are absent the job is skipped (no failed runs), so it is safe
# to merge before the secrets are configured.

# MANUAL-ONLY (2026-07-14). Auto-deploy on push to main is owned by the Cloud Build TRIGGER
# (75443609-…, see CLAUDE.md), which already runs cloudbuild.yaml on every merge. Running BOTH
# meant EVERY commit built TWICE in Cloud Build (the admin's "double double") — one run from the
# trigger, one from this workflow's `gcloud builds submit`. This workflow stays as a manual
# fallback (Actions → Run workflow) for when the trigger is unavailable; it no longer auto-fires.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for deploy credentials
        id: guard
        run: |
          if [ -n "${{ secrets.GCP_SA_KEY }}" ] && [ -n "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_SA_KEY / GCP_PROJECT_ID not set — skipping deploy. Add them to enable auto-deploy."
          fi

      # P-DEPLOY.5 — Release freeze/approval gate. Honors the opt-in gate served at
      # ${RELEASE_GATE_URL} (e.g. https://<app>/api/release/gate). If the secret is unset the check is
      # skipped (no enforcement); if set and the gate returns allowed:false, the deploy is BLOCKED.
      - name: Check release gate
        if: steps.guard.outputs.ready == 'true'
        run: |
          URL="${{ secrets.RELEASE_GATE_URL }}"
          if [ -z "$URL" ]; then
            echo "::notice::RELEASE_GATE_URL not set — release gate check skipped."
            exit 0
          fi
          RESP="$(curl -fsS "${URL}?sha=${{ github.sha }}" || echo '{"allowed":true,"reason":"gate unreachable — failing open"}')"
          echo "Release gate: $RESP"
          ALLOWED="$(printf '%s' "$RESP" | grep -o '"allowed":[a-z]*' | head -1 | cut -d: -f2)"
          if [ "$ALLOWED" = "false" ]; then
            echo "::error::Release gate is CLOSED — deploy blocked. $RESP"
            exit 1
          fi

      - name: Checkout
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        if: steps.guard.outputs.ready == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.guard.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build & deploy via Cloud Build
        if: steps.guard.outputs.ready == 'true'
        run: gcloud builds submit --config=cloudbuild.yaml --substitutions=_NOOP=1 .
