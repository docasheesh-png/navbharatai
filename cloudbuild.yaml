# Google Cloud Build Pipeline Configuration (cloudbuild.yaml)
# Orchestrated by navBharat AI for enterprise-scale Docker integration.

steps:
  # Step 1: Build the optimized container image with caching context
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'
      - '.'

  # Step 2: Push the container image directly to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'

  # Step 3: Push the stable latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'

  # Step 4: Deploy the immutable image revision to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'navbharat-ai-prod'
      - '--image'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--update-env-vars'
      - 'NODE_ENV=production'
      - '--allow-unauthenticated'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '3600'
      - '--concurrency'
      - '100'
      - '--cpu-boost'
      - '--execution-environment'
      - 'gen2'
      - '--quiet'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'
