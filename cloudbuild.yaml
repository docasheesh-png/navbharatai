# Google Cloud Build Pipeline Configuration (cloudbuild.yaml)
# Orchestrated by navBharat AI for enterprise-scale Docker integration.

steps:
  # Step 1: Build the optimized container image with caching context
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'
      - '.'

  # Step 2: Push the container image directly to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'

  # Step 3: Trigger container deployment onto managed Cloud Run instance (by-passing source zip limitations)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'navbharat-cloud-run'
      - '--image'
      - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--port'
      - '3000'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/navbharat-cloud-run:latest'
