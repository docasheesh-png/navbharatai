name: CI

# De-duplicated (2026-07-14): `push: ['**']` + `pull_request` ran CI TWICE on every PR branch
# (once for the branch push, once for the PR event). Now: `main` runs via push; every other branch
# runs via its pull_request (open/synchronize) — one CI run per change instead of two.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Bounded well above the real cost (~10 min after the de-duplication below) so a genuine hang fails
    # fast and legibly, instead of holding a runner for the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm's legacy `/v1/security/audits/quick` endpoint (used by `npm audit`) is being retired and now
      # returns a 400 "Invalid package tree" error on EVERY request — confirmed 2026-07-26 against main's
      # own committed lockfile, not caused by any specific PR. The bundled npm on Node 20 runners (10.8.x)
      # still calls that legacy endpoint. Confirmed (2026-07-26, via `npx npm@11.18.0 audit --json`) that
      # npm 11.x DOES call the correct new `/v1/security/advisories/bulk` endpoint instead — npm 12.x would
      # too but requires Node 22+, which this job doesn't run (npm 11.18.0 supports Node ^20.17.0). Pinned
      # (not @latest) for reproducibility. Remove this step (or note if it turned out not to help) once
      # confirmed either way — see PROGRESS.md 2026-07-26 for the full investigation.
      - name: Upgrade npm (root-cause attempt for the audit-gate false-block, see PROGRESS.md 2026-07-26)
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Security audit gate (P-TQA.7 — BLOCKS new high/critical; allowlist for triaged advisories)
        run: npm run audit:gate

      - name: Supply-chain provenance (P-SEC.10 — npm package signatures; informational, never blocks)
        run: npm audit signatures
        continue-on-error: true

      - name: License compliance gate (P-SEC.6 — BLOCKS new strong-copyleft GPL/AGPL)
        run: npm run license:gate

      - name: Generate SBOM (P-SEC.6 — CycloneDX)
        run: npm run sbom

      - name: Upload SBOM artifact (P-SEC.6)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn

      - name: Typecheck (frontend)
        run: npm run typecheck

      - name: Typecheck (server modules - strict guardrail)
        run: npm run typecheck:server

      # ONE test run, not two (2026-08-06). This job ran `npm test` (`vitest run`) and then
      # `npm run test:coverage` (`vitest run --coverage`) — the SAME 12,400 tests twice, the second time
      # with coverage instrumentation, which is the slower of the two. The coverage run already produces
      # the pass/fail signal, so the first was pure duplication and by far the largest cost in this job.
      #
      # WHY IT MATTERED ENOUGH TO CHANGE: two consecutive runs were cancelled at exactly 15.0 and 15.1
      # minutes while a 13-minute run passed, so CI was sitting on a hard cap that comes from outside
      # this file (there is no timeout-minutes here and ubuntu-latest defaults to 360). Every PR had
      # become a coin flip. No gate is removed — the coverage gate still blocks on a real regression, and
      # a failing test still fails this step exactly as before.
      - name: Test + coverage gate (P-TQA.1 — runs the suite once; BLOCKS on a real coverage regression)
        run: npm run test:coverage

      - name: Build (frontend bundle + server bundle — catches build-only breaks)
        run: npm run build

      - name: Bundle size budget (P-TQA.5 — fail on bundle bloat)
        run: npm run test:bundle

      - name: Boot smoke-check (server starts without crash)
        run: npm run boot:check
