# Build & publish the NavBharatAI Pro v3.0 custom E2B builder template.
#
# WHY A WORKFLOW: `e2b template build` needs Docker + Docker Hub egress + the
# E2B API key. GitHub's runners have all three; the Claude web sandbox does not
# (Docker Hub and api.e2b.dev are blocked there). So the one-time template build
# runs here instead of on anyone's laptop.
#
# HOW TO RUN:
#   1. Repo → Settings → Secrets and variables → Actions → New repository secret
#        Name:  E2B_API_KEY     Value: <your e2b.dev API key>
#   2. Repo → Actions → "Build E2B Builder Template" → Run workflow.
#   3. When it finishes, open the run → the job summary prints the TEMPLATE ID.
#   4. Set that id as the Cloud Run env var  E2B_TEMPLATE_ID  (the follow-up code
#      wiring PR makes the server use it). Until then nothing changes in prod.
#
# Manual-only (workflow_dispatch) so it never rebuilds — and never incurs E2B
# build cost — on ordinary pushes.

name: Build E2B Builder Template

on:
  workflow_dispatch:
    inputs:
      template_name:
        description: 'E2B template name'
        required: true
        default: 'navbharat-builder'

jobs:
  build-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify E2B_API_KEY secret is configured
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo "::error::E2B_API_KEY repo secret is not set. Add it under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "E2B_API_KEY is present (length ${#E2B_API_KEY})."

      - name: Install E2B CLI
        run: npm install -g @e2b/cli

      - name: Build & publish template
        working-directory: infra/e2b
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          e2b template build --name "${{ github.event.inputs.template_name }}"

      - name: Surface the template id
        working-directory: infra/e2b
        run: |
          echo "## E2B template build complete ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```toml' >> "$GITHUB_STEP_SUMMARY"
          cat e2b.toml >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          TID=$(grep -E '^\s*template_id' e2b.toml | head -1 | sed -E 's/.*=\s*"?([^"]+)"?.*/\1/')
          if [ -n "$TID" ]; then
            echo "**Template ID:** \`$TID\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Next: set Cloud Run env \`E2B_TEMPLATE_ID=$TID\`, then run the code-wiring PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Template id not found in e2b.toml — check the build log above._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload updated e2b.toml (with template id)
        uses: actions/upload-artifact@v4
        with:
          name: e2b-toml
          path: infra/e2b/e2b.toml
