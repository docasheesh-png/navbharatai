# P-SEC.2 — OWASP ZAP baseline tuning for NavBharatAI.
# Format: <ruleId>\t<action>\t<comment>   where action = IGNORE | WARN | FAIL
# Default for any rule not listed is WARN. HIGH-risk findings fail the job (see dast.yml -I not set).
#
# Rules we intentionally WARN (not FAIL) on — known/accepted for a Cloud Run + Firebase SPA:
10015	WARN	(Incomplete or no cache-control header — static assets are CDN-cached separately)
10027	WARN	(Information disclosure - suspicious comments — false positives in minified bundles)
10096	WARN	(Timestamp disclosure — harmless build timestamps in assets)
10109	WARN	(Modern web application — informational)
10049	WARN	(Non-storable/storable content — informational)
# Rules we IGNORE (not actionable in this stack):
10112	IGNORE	(Session management response identified — Firebase handles auth tokens client-side)
