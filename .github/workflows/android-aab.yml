# Build the SIGNED NavBharatAI Android App Bundle (.aab) for Google Play upload.
#
# WHY A WORKFLOW: building + signing an .aab needs the Android SDK + Gradle (GitHub's ubuntu runners
# ship them; the Claude web sandbox does not) AND your release keystore — a permanent secret that must
# live only with you. This workflow reads the keystore from GitHub repo SECRETS (never committed,
# never seen by anyone), so the .aab is produced without ever exposing the signing key in source.
#
# ONE-TIME SETUP (only you can do this — the keystore is your app's cryptographic identity FOREVER):
#   1. Create an upload keystore on your machine (keep the .jks + passwords safe; if lost you can
#      never update the app on Play):
#        keytool -genkeypair -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 \
#          -validity 10000 -alias navbharatai
#   2. Base64-encode it:  base64 -w0 upload-keystore.jks > keystore.b64   (macOS: base64 -i upload-keystore.jks -o keystore.b64)
#   3. Repo → Settings → Secrets and variables → Actions → add 4 secrets:
#        ANDROID_KEYSTORE_BASE64     = contents of keystore.b64
#        ANDROID_KEYSTORE_PASSWORD   = the store password you chose
#        ANDROID_KEY_ALIAS           = navbharatai   (the -alias above)
#        ANDROID_KEY_PASSWORD        = the key password (same as store password unless you set one)
#
# HOW TO RUN:
#   Repo → Actions → "Build Android App Bundle (.aab, signed)" → Run workflow (main).
#   When it finishes, download the `navbharatai-release-aab` artifact → upload app-release.aab to
#   Play Console (first time: create the app, enroll in Play App Signing — recommended).
#
# OPTIONAL — AUTO-PUBLISH TO PLAY (skip the manual download+upload):
#   Check the "upload_to_play" box when running the workflow and the freshly-signed .aab is pushed
#   straight to Google Play's INTERNAL testing track. One-time setup (all on the web — no Mac/CLI):
#     A. Google Play Console → Setup → API access → link (or create) a Google Cloud project, then create
#        a SERVICE ACCOUNT and grant it access. In Play Console → Users and permissions → invite the
#        service-account email with at least "Release to testing tracks" (Admin is simplest to start).
#     B. Google Cloud Console → that service account → Keys → Add key → JSON → download the key file.
#     C. Repo → Settings → Secrets and variables → Actions → add ONE secret:
#          PLAY_SERVICE_ACCOUNT_JSON = the entire contents of that downloaded JSON key file.
#   With the secret set + the box checked, the build auto-publishes to the internal track (versionCode
#   auto-increments per run). Leave the box UNCHECKED (default) to just build the downloadable artifact —
#   behaviour is then exactly as before. If the box is checked but the secret is missing, the run fails
#   EARLY with a clear message (it never silently skips the upload).

name: Build Android App Bundle (.aab, signed)

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: 'After building, upload the .aab straight to Google Play (internal testing track). Requires the PLAY_SERVICE_ACCOUNT_JSON secret (see the header for the one-time setup). Leave OFF to just build the downloadable artifact.'
        type: boolean
        default: false

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail EARLY and honestly if the signing secrets are not set — a Play Store .aab MUST be signed,
      # so we never hand back an unsigned bundle that would be rejected on upload.
      - name: Pre-flight — require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ANDROID_KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing — add them in Settings → Secrets and variables → Actions (see the header of this workflow file for the one-time keystore setup)."
            exit 1
          fi
          echo "All signing secrets present."

      # Only when the run asked to upload: fail EARLY and honestly if the Play service-account secret is
      # missing, instead of building for minutes then dying at the upload step. When upload is OFF (default)
      # this is skipped entirely and the workflow behaves exactly as before (artifact only).
      - name: Pre-flight — require the Play service-account secret (only when uploading)
        if: ${{ inputs.upload_to_play }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::upload_to_play is ON but PLAY_SERVICE_ACCOUNT_JSON is not set. Add it in Settings → Secrets and variables → Actions (see this workflow's header for the one-time service-account setup), or re-run with upload_to_play unchecked to just build the downloadable artifact."
            exit 1
          fi
          echo "Play service-account secret present — will upload to the internal track after the build."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Gradle/AGP requirement)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode the release keystore from the secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build the SIGNED release bundle (.aab) + universal APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Play requires a strictly-increasing versionCode per upload — use the run number so every
          # build is uploadable without editing build.gradle. versionName stays human-readable.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          # META (Facebook / Instagram) APP EVENTS — optional, and deliberately NOT pre-flighted like
          # the signing secrets are. A missing keystore must fail the build (Play rejects an unsigned
          # bundle), but a missing Facebook credential must NOT: the app is perfectly shippable
          # without ad measurement, and build.gradle simply omits the SDK. Set both repo secrets to
          # turn it on; the NEXT bundle then reports installs to Meta.
          # ⚠️ Before rolling out a bundle built WITH these set, update Play Console → App content →
          # Data safety — that build collects the advertising ID and app events.
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        # bundleRelease → the .aab for Play. assembleRelease → a SIGNED universal .apk for the website's
        # "Download app" button (a direct sideload — Play only accepts the .aab). Both use the same
        # release signingConfig, so the APK is genuinely installable.
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Always remove the decoded keystore (never leaves the runner)
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload the .aab artifact
        uses: actions/upload-artifact@v7
        with:
          name: navbharatai-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # The SIGNED universal APK for the website's "Download app" button. Download it, host it at a
      # stable URL (GitHub release asset / Firebase Hosting / any CDN), and set VITE_APK_DOWNLOAD_URL to
      # that URL so the button downloads it directly. (Until set, the button falls back to the Play listing.)
      - name: Upload the .apk artifact (direct-download / sideload)
        uses: actions/upload-artifact@v7
        with:
          name: navbharatai-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # OPTIONAL auto-publish: push the freshly-signed .aab straight to Google Play's INTERNAL testing
      # track. Runs ONLY when the run requested it (upload_to_play) — the pre-flight above already proved
      # the PLAY_SERVICE_ACCOUNT_JSON secret is present, so this never dies half-way. Play App Signing
      # re-signs with the app signing key on upload, so the upload-key-signed .aab is exactly what Play
      # expects. Track = internal (safest — visible only to your internal testers); promote to
      # closed/production from the Play Console UI. status = completed (the release is live to that track).
      # SECURITY NOTE: this third-party action receives the Play service-account JSON, so it is pinned to a
      # full commit SHA (not a mutable tag) for supply-chain safety. The maintained action is
      # `r0adkll/upload-google-play` — a prior wrong slug (`r0adz0/...`, which does not exist) made GitHub
      # fail to RESOLVE this step and broke EVERY run of this workflow, because Actions resolves every
      # `uses:` up front regardless of the `if:` guard — so even artifact-only builds (upload_to_play=false)
      # died before starting. Pinned to v1.1.5.
      - name: Upload to Google Play (internal track)
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.navbharat.ai
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Summary
        run: |
          echo "## NavBharatAI signed .aab built ✅" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ secrets.FACEBOOK_APP_ID }}" ] && [ -n "${{ secrets.FACEBOOK_CLIENT_TOKEN }}" ]; then
            echo "- Meta app events: **ON** — this bundle reports installs/app-opens to Meta. Confirm Play Console → App content → Data safety is up to date before rolling it out." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Meta app events: **off** (FACEBOOK_APP_ID / FACEBOOK_CLIENT_TOKEN not set) — no Facebook SDK is in this bundle." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.upload_to_play }}" = "true" ]; then
            echo "🚀 **Auto-uploaded to Google Play** (internal testing track) via the service account. Open Play Console → Testing → Internal testing to see the new release, then promote it when ready." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Download the **navbharatai-release-aab** artifact above and upload \`app-release.aab\` to Google Play Console. (Tip: re-run with **upload_to_play** checked to publish automatically once \`PLAY_SERVICE_ACCOUNT_JSON\` is set.)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "versionCode = ${{ github.run_number }} (auto-increments each run, as Play requires). Bundled mode: the app runs from the bundle built in this workflow (API calls still hit navbharatai.com) — auth and all features work unchanged." >> "$GITHUB_STEP_SUMMARY"
