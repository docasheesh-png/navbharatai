# ⛔ LEGACY — THIS FILE IS NOT READ BY ANYTHING. DO NOT TREAT IT AS CONFIG.
#
# E2B deprecated build system v1 (the `e2b template build` CLI path this file was
# written for) on 2026-06-27. The template is now built by `build.mjs` via the
# SDK, and **`build.mjs` is the only source of truth for the sandbox's size**:
#
#     cpuCount: 2, memoryMB: 4096      <- the machine we actually run
#
# 🔴 THE `cpu_count = 4` BELOW IS WRONG AND HAS BEEN SINCE v2 LANDED. It is left
# here only as history; it is kept from being dangerous by this warning. Reading
# it as live config would mis-size the sandbox by 2×, and since 2026-09-11 the
# sandbox size is what `src/server/AgentV3/sandboxRate.ts` prices VM time with —
# so a wrong number here would become a wrong number on the admin cost dashboard.
# That is not hypothetical: a per-vCPU price read as a per-wall-hour price is
# exactly the 2× error that file exists to end.
#
# To change the sandbox size, edit `build.mjs` (or its CPU_COUNT / MEMORY_MB env
# overrides) and re-run the `e2b-template.yml` workflow — then update the
# E2B_SANDBOX_VCPU / E2B_SANDBOX_RAM_GB defaults in sandboxRate.ts to match.

template_name = "navbharat-builder"
dockerfile    = "e2b.Dockerfile"

# Kept EQUAL to build.mjs so nobody can rebuild from a bigger machine by mistake
# (this file is not read by v2, but a wrong number here is still a trap). What each
# number costs, from E2B's published rates ($0.0504/vCPU-h, $0.0162/GB-h — they
# reproduce two consecutive invoices to the cent, see sandboxRate.ts):
#   2 vCPU + 4 GB  = $0.1656/h  (today)      4 vCPU + 4 GB = $0.2664/h  (+61%)
#   2 vCPU + 2 GB  = $0.1332/h  (−20%)       2 vCPU + 3 GB = $0.1494/h  (−10%)
# RAM is billed per WALL-CLOCK hour, so anything that makes a build slower costs
# more; fewer vCPUs are not a saving by default (break-even ≈ 1.44× slower).
# Changing RAM needs the measured peak first — SANDBOX_PEAK_MEMORY in the build report.
cpu_count = 2
memory_mb = 4096

# No start_cmd: E2B's envd manages the sandbox lifecycle and the builders exec
# commands on demand (npm install, npm run dev, …). A long-running dev server is
# started per-build by the agent, not by the image.
